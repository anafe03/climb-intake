# Category -> queue. Optional per-urgency override. Escalated tickets are ALSO copied to escalation_queue.
queues:
  billing:
    default: billing-support
    critical: billing-oncall
  bug:
    default: engineering-triage
    critical: engineering-oncall
  security:
    default: security-incident-response
  legal_contract:
    default: legal-and-account-management
  onboarding:
    default: customer-success
  feature_request:
    default: product-feedback
  spam:
    default: spam-review
  other:
    default: general-support
escalation_queue: human-escalation-desk
# Tickets the classifier is unsure about go to a person instead of being forced into a category.
# Escalated tickets are exempt: they already have a human in the loop via the escalation queue.
low_confidence:
  threshold: 0.5
  queue: human-review
