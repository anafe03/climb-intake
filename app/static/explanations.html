<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explanations: Climb Intake</title>
<style>
:root{
  --teal:#03323a; --teal-mid:#006172; --coral:#f27557; --coral-deep:#92351e; --cyan:#a2f1f8;
  --sage:#87a48c; --mint:#c6f0cd;
  --paper:#f9f9f5; --card:#fff; --sunken:#f2f2ea; --line:#e4e4d8; --line2:#cdcdc0;
  --ink:#121d1f; --dim:#5d6a6b; --faint:#949c9c;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
header{background:var(--teal);color:#fff;padding:22px 0}
.wrap{max-width:1000px;margin:0 auto;padding:0 26px}
header h1{margin:0;font-size:20px;font-weight:650}
header p{margin:5px 0 0;color:var(--cyan);font-size:13.5px}
nav{background:var(--teal-mid);padding:0}
nav .wrap{display:flex;gap:2px}
nav a{color:#cfe9ed;text-decoration:none;font:600 13px var(--sans);padding:11px 16px}
nav a:hover{background:rgba(255,255,255,.1);color:#fff}
nav a.on{background:var(--paper);color:var(--teal)}
main{padding:30px 0 90px}
h2{font:700 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  margin:42px 0 16px;padding-bottom:9px;border-bottom:2px solid var(--coral)}
h2:first-of-type{margin-top:6px}
h3{font-size:17px;font-weight:650;margin:26px 0 8px}
p{margin:0 0 13px}
.lead{font-size:16px;color:var(--dim);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:16px 0}
figure{margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;overflow-x:auto}
figcaption{font-size:13px;color:var(--dim);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
svg{display:block;margin:0 auto;max-width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0}
th{text-align:left;font:700 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);padding:0 12px 9px 0;border-bottom:1px solid var(--line2)}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:600;white-space:nowrap}
code{font:13px var(--mono);background:var(--sunken);padding:2px 6px;border-radius:4px}
.key{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-top:14px}
.key span{display:flex;align-items:center;gap:7px}
.key i{width:13px;height:13px;border-radius:3px;display:inline-block}
.note{border-left:3px solid var(--sage);background:var(--sunken);border-radius:0 9px 9px 0;
  padding:13px 16px;margin:16px 0;font-size:14px}
.note > b:first-child{display:block;margin-bottom:3px}
.q{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--coral);
  border-radius:0 11px 11px 0;padding:16px 20px;margin:16px 0}
.q h3{margin:0 0 7px;font-size:16px}
.q p:last-child{margin-bottom:0}
@media print{nav{display:none}body{font-size:11pt}figure{break-inside:avoid}}
tr.bad td{background:#fdeee9}
tr.good td{background:#eef6ef}
tr.bad td b{color:var(--climb-coral-deep,#92351e)}

.rec{border:2px solid var(--coral);border-radius:12px;padding:18px 20px;margin:0 0 26px;background:#fff}
.rec .lab{font:700 9.5px var(--sans,inherit);letter-spacing:.1em;text-transform:uppercase;color:var(--coral-deep);margin-bottom:6px}
.rec h3{margin:0 0 8px;font-size:19px}
.rec p{margin:0 0 8px}
.rec p:last-child{margin-bottom:0}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 26px}
.big3 .c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.big3 .k{font:700 9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.big3 .v{font-size:27px;font-weight:650;line-height:1.1;letter-spacing:-.02em}
.big3 .s{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
@media (max-width:720px){.big3{grid-template-columns:1fr}}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pick td{background:#eef6ef}
.pick td:first-child::after{content:" \2190  running this";color:var(--sage);font-weight:600;font-size:12px}

.rlink{color:var(--coral-deep);font-weight:650;text-decoration:underline;text-underline-offset:3px}
.ev{margin-top:28px}
.ev h3{font-size:15px;margin:22px 0 2px}
.ev h3 .cnt{font-weight:500;color:var(--dim);font-size:13px;margin-left:8px}
.ev .about{margin:0 0 8px;color:var(--dim);font-size:13px}
table.evt td{vertical-align:top;font-size:13px;padding:7px 10px 7px 0}
table.evt td.ok{color:var(--sage);font-weight:700;width:18px}
table.evt td.id{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);white-space:nowrap;width:70px}
table.evt td.kw{white-space:nowrap;font-size:12px;color:var(--dim)}
table.evt td.kw b{color:var(--coral-deep)}

.explain{margin-top:22px;max-width:760px}
.explain p{margin:0 0 10px;font-size:14px;line-height:1.6}

.lead{font-size:17px;line-height:1.65;max-width:760px;margin:6px 0 8px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 6px}
.steps4 .c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.steps4 .c b{display:block;font-size:15px;margin-bottom:4px}
.steps4 .c span{color:var(--dim);font-size:13px;line-height:1.5}
@media (max-width:760px){.steps4{grid-template-columns:1fr 1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.go{display:inline-block;margin:26px 0 40px;background:var(--coral);color:#fff;font-weight:650;
  padding:12px 20px;border-radius:9px;text-decoration:none}
.go:hover{filter:brightness(.95)}

.cardbtn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;transition:border-color .12s,box-shadow .12s}
.cardbtn:hover{border-color:var(--coral);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.cardbtn b{display:block;font-size:15px;margin-bottom:4px}
.cardbtn span{color:var(--dim);font-size:13px;line-height:1.5}
.cardbtn em{display:block;margin-top:8px;font-style:normal;font-size:12px;color:var(--coral-deep);font-weight:600}
.pop-bg{position:fixed;inset:0;background:rgba(3,30,36,.55);display:none;align-items:flex-start;
  justify-content:center;padding:60px 16px;z-index:50;overflow:auto}
.pop-bg.on{display:flex}
.pop{background:var(--paper);border-radius:12px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.pop-h{display:flex;align-items:center;justify-content:space-between;background:var(--coral);color:#fff;
  padding:14px 20px;border-radius:12px 12px 0 0;font-weight:650;font-size:16px}
.pop-h button{all:unset;cursor:pointer;font-size:20px;line-height:1;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.12)}
.pop-b{padding:18px 22px 22px}
.pop-b p{margin:0 0 12px;font-size:14.5px;line-height:1.6}
a.inl{color:var(--coral-deep);font-weight:600;cursor:pointer}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 30px}
@media (max-width:860px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.grouplabel{font:700 10.5px var(--sans,inherit);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:22px 0 0}
.pop{max-width:860px}
.pop-b h3{font-size:14px;margin:22px 0 8px}
.pop-b h3.q{border-top:2px solid var(--coral);padding-top:14px;margin-top:26px}
.pop-b ul,.pop-b ol{padding-left:22px}
.pop-b li{font-size:14px;line-height:1.6;margin:5px 0}
.pop-b table{margin:8px 0 12px}

.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:11px 2px;font-weight:600;font-size:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"+";color:var(--coral-deep);font-weight:700;display:inline-block;width:18px}
.faq details[open] summary::before{content:"\2212"}
.faq details>div{padding:0 2px 12px 18px;font-size:14px;line-height:1.6;color:var(--dim)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Strategy, design and FAQs</h1>
  <p>Each decision, then the system as a whole</p>
</div></header>
<nav><div class="wrap">
  <a href="/intro">Intro</a>
  <a href="/">Intake</a>
  <a href="/explanations" class="on">Explanations</a>
  <a href="/optimization">Cost &amp; models</a>
  <a href="/notes">Presenter notes</a>
  <a href="/docs">API</a>
</div></nav>
<main class="wrap">
  <p class="grouplabel">Each decision</p><div class="cards" id="fields"></div>
  <p class="grouplabel">Across the whole system</p><div class="cards" id="system"></div>
</main>
<div class="pop-bg" id="popbg"><div class="pop"><div class="pop-h"><span id="poptitle"></span><button aria-label="Close" id="popx">×</button></div><div class="pop-b" id="popbody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// One source: docs/EXPLANATIONS.md. Every "## " section is a card; clicking it opens the section.
const FIELDS=['Who sent it','What kind of request','How urgent','Escalation','Where it goes'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bg=document.getElementById('popbg');
const close=()=>bg.classList.remove('on');
document.getElementById('popx').onclick=close;
bg.onclick=e=>{if(e.target===bg)close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
fetch('/explanations.md').then(r=>r.text()).then(md=>{
  const sections=md.split(/^## /m).slice(1).map(chunk=>{
    const nl=chunk.indexOf('\n'); const title=chunk.slice(0,nl).trim();
    let body=chunk.slice(nl+1).trim();
    const m=body.match(/^\*([^*]+)\*\s*/); const summary=m?m[1]:'';
    if(m) body=body.slice(m[0].length);
    return {title,summary,body};
  });
  const card=(s,i)=>`<button class="cardbtn" data-i="${i}"><b>${esc(s.title)}</b><span>${esc(s.summary)}</span><em>Open \u2192</em></button>`;
  document.getElementById('fields').innerHTML=sections.map((s,i)=>FIELDS.includes(s.title)?card(s,i):'').join('');
  document.getElementById('system').innerHTML=sections.map((s,i)=>FIELDS.includes(s.title)?'':card(s,i)).join('');
  document.querySelectorAll('.cardbtn').forEach(b=>b.onclick=()=>{
    const s=sections[+b.dataset.i];
    document.getElementById('poptitle').textContent=s.title;
    const body=document.getElementById('popbody');
    body.innerHTML=marked.parse(s.body);
    // Each question opens to its answer.
    body.querySelectorAll('h3').forEach(h=>{
      if(h.textContent.trim()!=='Questions') return;
      h.classList.add('q');
      const ul=h.nextElementSibling; if(!ul||ul.tagName!=='UL') return;
      const wrap=document.createElement('div'); wrap.className='faq';
      [...ul.children].forEach(li=>{
        const q=li.querySelector('strong'); if(!q) return;
        const qt=q.textContent; q.remove();
        const d=document.createElement('details');
        d.innerHTML=`<summary>${esc(qt)}</summary><div>${li.innerHTML.trim()}</div>`;
        wrap.appendChild(d);
      });
      ul.replaceWith(wrap);
    });
    bg.classList.add('on'); bg.scrollTop=0;
  });
}).catch(()=>{document.getElementById('fields').textContent='Could not load the explanations.'});
</script>
</body>
</html>
