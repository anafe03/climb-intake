<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climb Intake</title>
<style>
:root{
  /* Climb brand tokens, from climb.ai's stylesheet */
  --climb-teal:#03323a; --climb-teal-mid:#006172; --climb-teal-soft:#8dbfc9;
  --climb-coral:#f27557; --climb-coral-mid:#b75238; --climb-coral-deep:#92351e; --climb-coral-darkest:#531405;
  --climb-cyan:#a2f1f8; --climb-mint:#c6f0cd; --climb-sage:#87a48c;
  --climb-paper:#f9f9f5; --climb-paper-line:#d3d3ca; --climb-ink:#121d1f;

  --bg:var(--climb-paper); --card:#fff; --sunken:#f2f2ea;
  --line:#e4e4d8; --line-2:var(--climb-paper-line);
  --text:var(--climb-ink); --dim:#5d6a6b; --faint:#949c9c;
  --primary:var(--climb-coral); --on-primary:#3a1004;
  --danger:var(--climb-coral-deep); --wash:#fdeee9; --wash-line:#f0d3c8;
  --warn:var(--climb-coral-mid);
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08191c; --card:#0d2328; --sunken:#0a1d21;
  --line:#16343a; --line-2:#255059;
  --text:#e8f1f1; --dim:#9db3b5; --faint:#6f8a8d;
  --danger:#f78e73; --wash:#2b1712; --wash-line:#5a3226; --warn:#d98a6c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;border-radius:7px}
button:disabled{opacity:.4;cursor:default}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{background:var(--climb-teal);color:#fff;padding:13px 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:11px}
.brand b{font-size:15.5px;font-weight:650;display:block}
.brand small{font-size:12px;color:var(--climb-cyan);display:block;margin-top:1px}
.mode{font:700 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;
  border-radius:999px;background:var(--climb-coral);color:#3a1004;white-space:nowrap}
.mode.off{background:var(--climb-cyan);color:var(--climb-teal)}

.composer{background:var(--card);border-bottom:1px solid var(--line);padding:14px 0}
.composer .wrap{display:flex;gap:10px}
.composer textarea{flex:1;min-height:44px;max-height:150px;padding:11px 14px;resize:none;
  border:1px solid var(--line-2);border-radius:8px;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
.composer textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
.composer textarea::placeholder{color:var(--faint)}
.go{background:var(--primary);color:var(--on-primary);padding:11px 22px;white-space:nowrap}
.go:hover:not(:disabled){filter:brightness(1.07)}

.status{max-height:0;overflow:hidden;transition:max-height .16s;background:var(--sunken)}
.status.on{max-height:60px;border-bottom:1px solid var(--line)}
.status .wrap{padding:9px 20px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:9px}
.status.err{background:var(--wash);color:var(--climb-coral-darkest)}
.spin{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--primary);
  border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.toolbar{padding:16px 0 10px}
.toolbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.count{font:700 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-right:auto}
.count b{color:var(--text);font-size:14px}
.count i{color:var(--danger);font-style:normal}
.seg{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--dim);padding:6px 13px;font-size:12px}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.seg button+button{border-left:1px solid var(--line-2)}
select{font:600 12px var(--sans);padding:6px 9px;border:1px solid var(--line-2);border-radius:7px;
  background:var(--card);color:var(--text)}
.tool{background:transparent;border-color:var(--line-2);color:var(--dim);padding:6px 11px;font-size:12px}
.tool:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.tool.warn:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
input[type=file]{display:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 4px}

/* ── list ──────────────────────────────────────────────────────────────── */
.list{padding-bottom:70px}
.tk{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line-2);
  border-radius:9px;padding:13px 16px;margin-bottom:8px;cursor:pointer;
  display:grid;grid-template-columns:1fr auto;gap:4px 18px;align-items:start}
.tk:hover{border-color:var(--line-2);box-shadow:0 2px 10px rgba(3,50,58,.07)}
.tk:hover .open{opacity:1}
.tk.high{border-left-color:var(--warn)}
.tk.critical{border-left-color:var(--danger)}
.tk.esc{background:var(--wash);border-color:var(--wash-line)}
.tk .m{grid-column:1;display:flex;gap:8px;align-items:center;font:700 10.5px var(--sans);
  letter-spacing:.05em;text-transform:uppercase;color:var(--faint);flex-wrap:wrap}
.tk .m .c{color:var(--dim)}
.tk .m .u.high{color:var(--warn)} .tk .m .u.critical{color:var(--danger)}
.tk .m .flag{color:#fff;background:var(--danger);padding:2px 7px;border-radius:4px;letter-spacing:.06em}
.tk .t{grid-column:1;font-size:13.5px;line-height:1.45;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk .q{grid-column:1;font:11px var(--mono);color:var(--faint);margin-top:2px}
.tk .side{grid-column:2;grid-row:1/4;text-align:right;display:flex;flex-direction:column;
  align-items:flex-end;gap:5px;min-width:90px}
.tk .when{font:11px var(--mono);color:var(--faint);white-space:nowrap}
.tk .took{font:11px var(--mono);color:var(--faint);white-space:nowrap}
.open{font:600 11.5px var(--sans);color:var(--primary);opacity:0;transition:opacity .12s;white-space:nowrap}
@media (max-width:620px){.tk{grid-template-columns:1fr}.tk .side{grid-column:1;grid-row:auto;
  flex-direction:row;align-items:center;text-align:left;margin-top:4px}}

.empty{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:34px 30px;color:var(--dim)}
.empty h3{margin:0 0 10px;font-size:16px;color:var(--text);font-weight:650}
.empty p{margin:0 0 10px;font-size:14px;line-height:1.65;max-width:620px}
.empty ol{font-size:14px;line-height:1.9;padding-left:22px;margin:0}
.kbd{font:11px var(--mono);background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

/* ── modal ─────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(3,30,35,.55);backdrop-filter:blur(2px);
  display:none;align-items:flex-start;justify-content:center;padding:36px 20px;z-index:50;overflow-y:auto}
.scrim.on{display:flex}
.modal{background:var(--bg);border-radius:14px;max-width:880px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mhead{background:var(--climb-teal);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhead .b{font:700 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.15)}
.mhead .b.u-high{background:var(--climb-coral-mid)}
.mhead .b.u-critical{background:var(--climb-coral);color:#3a1004}
.mhead .b.esc{background:#fff;color:var(--climb-coral-deep)}
.mhead .x{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;
  width:30px;height:30px;border-radius:7px;font-size:16px;line-height:1;padding:0}
.mhead .x:hover{background:rgba(255,255,255,.14)}
.mbody{padding:24px}
.mnav{display:flex;gap:8px;align-items:center;padding:0 24px 18px}
.mnav button{background:transparent;border-color:var(--line-2);color:var(--dim);padding:5px 11px;font-size:12px}
.mnav button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.mnav .pos{font:11px var(--mono);color:var(--faint);margin-left:auto}

.req{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--primary);
  border-radius:0 9px 9px 0;padding:15px 18px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;margin-bottom:22px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.f{background:var(--card);padding:14px 16px}
.f .k{font:700 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.f .v{font-size:15px;font-weight:650;line-height:1.3}
.f .v.high{color:var(--warn)} .f .v.critical{color:var(--danger)}
.f .v.yes{color:var(--danger)} .f .v.none{color:var(--faint);font-weight:500}
.f .s{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.sig{display:inline-block;font:10.5px/1.5 var(--mono);background:var(--sunken);border:1px solid var(--line);
  border-radius:4px;padding:2px 7px;margin:4px 4px 0 0;color:var(--dim);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.dest{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 18px;
  margin-bottom:22px;display:flex;gap:9px 13px;align-items:center;flex-wrap:wrap}
.dest .k{width:100%;font:700 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.qp{font:600 12.5px var(--mono);background:var(--sunken);border:1px solid var(--line-2);padding:6px 12px;border-radius:6px}
.qp.esc{background:var(--danger);border-color:var(--danger);color:#fff}
.sec{margin-bottom:22px}
.sec h3{font:700 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 9px}
.prose{font-size:14px;line-height:1.7}
.note{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px 16px;font-size:13px;line-height:1.6}
.note.changed{border-left:3px solid var(--warn);border-radius:0 9px 9px 0}
.note.calm{color:var(--dim)}
.note code{font:11.5px var(--mono);background:var(--sunken);padding:2px 6px;border-radius:4px;color:var(--text);
  display:inline-block;margin-top:5px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--faint);
  border-top:1px solid var(--line);padding-top:14px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--dim);font-size:12px;font-weight:650}
summary:hover{color:var(--primary)}
pre{background:var(--climb-teal);color:#d7ecef;border-radius:8px;padding:13px;overflow:auto;
  font:11px/1.5 var(--mono);max-height:340px;margin:9px 0 0}
</style>
</head>
<body>

<header><div class="wrap hrow">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M2 21.5 L10 6.5 L14.6 15 L17.2 10.5 L24 21.5 Z" fill="#f27557"/>
      <path d="M10 6.5 L6.1 13.8 L8.4 12.6 L10.4 14.1 L12.3 12.2 L10 6.5 Z" fill="#fff"/>
    </svg>
    <div><b>Climb Intake</b><small>Reads a messy customer request and decides which team gets it</small></div>
  </div>
  <span class="mode" id="mode">…</span>
</div></header>

<div class="composer"><div class="wrap">
  <textarea id="text" rows="1" placeholder="Paste any customer message — don't label it. Press ⌘↵"></textarea>
  <button class="go" id="submit">Read it</button>
</div></div>

<div class="status" id="status"><div class="wrap" id="statustext"></div></div>

<div class="toolbar"><div class="wrap">
  <span class="count" id="count"></span>
  <div class="seg">
    <button id="f-all" class="on">All</button>
    <button id="f-esc">Needs a human</button>
  </div>
  <select id="sort">
    <option value="newest">Sort: most recent</option>
    <option value="urgency">Sort: most urgent</option>
    <option value="slowest">Sort: longest to read</option>
    <option value="fastest">Sort: quickest to read</option>
    <option value="category">Sort: category</option>
  </select>
</div></div>
<div class="wrap tools">
  <button class="tool" id="samples">Load 10 samples</button>
  <button class="tool" id="demo">Load 32 demo</button>
  <button class="tool" id="up">Upload file</button>
  <button class="tool warn" id="clear">Clear all</button>
  <input type="file" id="file" accept=".json,.jsonl,.csv,.txt">
</div>

<div class="wrap list" id="list"></div>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>{s=String(s).replace(/_/g,' ');return s[0].toUpperCase()+s.slice(1)};
let rows=[], escOnly=false, sortBy='newest', openId=null;

const CATEGORY={billing:'A billing question',bug:'Something is broken',security:'A security problem',
  legal_contract:'A contract or legal matter',onboarding:'An onboarding or delivery issue',
  feature_request:'A request for something new',spam:'Spam — not a real request',other:'A general question'};
const URGENCY={low:'Low — whenever',medium:'Medium — normal queue',
  high:'High — there is a deadline or real impact',critical:'Critical — money or many people affected right now'};
const REASON={security_incident:'a possible security incident',data_exposure:'data was exposed to the wrong people',
  legal_threat:'a legal or contract threat',compliance_request:'a regulatory demand with a deadline',
  executive_mention:'an executive is involved'};
const RANK={critical:3,high:2,medium:1,low:0};

async function api(p,o={}){const r=await fetch(p,o);
  if(!r.ok) throw new Error((await r.text()).slice(0,240));
  return r.headers.get('content-type')?.includes('json')?r.json():r.text();}

let st;
function status(msg,{spin=false,err=false,hold=0}={}){
  clearTimeout(st); const el=$('#status');
  if(!msg){el.classList.remove('on','err');return}
  $('#statustext').innerHTML=(spin?'<span class="spin"></span>':'')+esc(msg);
  el.classList.add('on'); el.classList.toggle('err',err);
  if(hold) st=setTimeout(()=>el.classList.remove('on','err'),hold);
}
function busy(on){document.querySelectorAll('.composer button,.tools button').forEach(b=>b.disabled=on)}
function ago(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
const took=ms=>ms<1000?ms+' ms':(ms/1000).toFixed(1)+' s';

const SORTS={
  newest:(a,b)=>(b.created_at||'').localeCompare(a.created_at||''),
  urgency:(a,b)=>{const x=a.extraction,y=b.extraction;
    if(x.escalate!==y.escalate) return x.escalate?-1:1;
    if(RANK[y.urgency]!==RANK[x.urgency]) return RANK[y.urgency]-RANK[x.urgency];
    return SORTS.newest(a,b)},
  slowest:(a,b)=>b.latency_ms-a.latency_ms,
  fastest:(a,b)=>a.latency_ms-b.latency_ms,
  category:(a,b)=>a.extraction.category.localeCompare(b.extraction.category)||SORTS.urgency(a,b),
};
const visible=()=>(escOnly?rows.filter(d=>d.extraction.escalate):rows).slice().sort(SORTS[sortBy]);

function renderList(){
  const v=visible(), n=rows.filter(d=>d.extraction.escalate).length;
  $('#count').innerHTML=rows.length?`<b>${rows.length}</b> tickets · <i>${n} need a human</i>`:'';
  if(!v.length){
    $('#list').innerHTML=rows.length
      ?`<div class="empty"><h3>Nothing here</h3><p>No tickets match this filter.</p></div>`
      :`<div class="empty"><h3>What this does</h3>
         <p>Customer requests arrive as freeform text and nobody labels them. This service reads each one
            and works out <b>who sent it</b>, <b>what kind of request it is</b>, <b>how urgent it is</b>, and
            <b>whether a person needs to see it</b> — then sends it to the right team.</p>
         <p>To watch it work:</p>
         <ol><li>Press <span class="kbd">Load 10 samples</span> above, or</li>
             <li>paste any customer message at the top and press <span class="kbd">Read it</span>.</li></ol>
         <p style="margin-top:14px">Then click any ticket to open the full breakdown.</p></div>`;
    return;
  }
  $('#list').innerHTML=v.map(d=>{const x=d.extraction;return `
    <div class="tk ${x.urgency} ${x.escalate?'esc':''}" data-id="${d.id}">
      <div class="m"><span class="c">${esc(cap(x.category))}</span>
        <span class="u ${x.urgency}">${esc(x.urgency)}</span>
        ${x.escalate?'<span class="flag">Needs a human</span>':''}</div>
      <div class="t">${esc(d.ticket.text)}</div>
      <div class="q">→ ${esc(d.queue)}${d.escalation_queue?' + '+esc(d.escalation_queue):''}</div>
      <div class="side">
        <span class="when">${esc(ago(d.created_at))}</span>
        <span class="took">${esc(took(d.latency_ms))}</span>
        <span class="open">Open ↗</span>
      </div>
    </div>`}).join('');
  document.querySelectorAll('.tk').forEach(t=>t.onclick=()=>openModal(t.dataset.id));
}

/* ── modal ─────────────────────────────────────────────────────────────── */
async function openModal(id){
  openId=id;
  const u=new URL(location); u.searchParams.set('t',id); history.replaceState(null,'',u);
  $('#scrim').classList.add('on'); document.body.style.overflow='hidden';
  $('#modal').innerHTML=`<div class="mbody" style="padding:60px;text-align:center;color:var(--faint)">
    <span class="spin" style="display:inline-block"></span></div>`;
  const d=await api('/tickets/'+id), x=d.extraction, L=d.llm_extraction;
  const moved=k=>L&&JSON.stringify(L[k])!==JSON.stringify(x[k]);
  const netChange=L&&['category','urgency','escalate'].some(k=>JSON.stringify(L[k])!==JSON.stringify(x[k]));
  const trail=d.overrides.map(o=>`<code>${esc(o)}</code>`).join('');

  let guard;
  if(d.overrides.length&&(netChange||!L))
    guard=`<div class="note changed"><b>The safety net changed the answer.</b> A keyword rule caught something
      the reading missed. Rules may only make a ticket <i>more</i> urgent or escalated, never less.<br>${trail}</div>`;
  else if(d.overrides.length)
    guard=`<div class="note calm"><b>Rules fired, then cancelled out.</b> One rule matched and another undid it,
      so what ships is exactly what the model said. The trail is kept for audit:<br>${trail}</div>`;
  else if(d.rule_hits.length)
    guard=`<div class="note calm">A keyword rule matched and agreed with the reading — nothing changed.<br>
      ${d.rule_hits.map(h=>`<code>${esc(h.rule)} on “${esc(h.matched)}”</code>`).join('')}</div>`;
  else guard=`<div class="note calm">No escalation keyword matched, so the reading stands as-is.</div>`;

  const who=x.customer.name
    ? `${esc(x.customer.name)}${x.customer.contact_name?`<div class="s">${esc(x.customer.contact_name)}</div>`:''}`
    : `<span class="none">Not stated</span><div class="s">The message never names a company, so it's left blank
        rather than guessed.${x.customer.identifiers.length?' Picked up: '+esc(x.customer.identifiers.join(', ')):''}</div>`;

  const v=visible(), i=v.findIndex(r=>r.id===id);
  $('#modal').innerHTML=`
    <div class="mhead">
      <span class="b">${esc(cap(x.category))}</span>
      <span class="b u-${x.urgency}">${esc(x.urgency)}</span>
      ${x.escalate?'<span class="b esc">Needs a human</span>':''}
      <button class="x" id="mx" aria-label="Close">×</button>
    </div>
    <div class="mnav">
      <button id="mprev" ${i<=0?'disabled':''}>← Previous</button>
      <button id="mnext" ${i>=v.length-1?'disabled':''}>Next →</button>
      <span class="pos">${i+1} of ${v.length}${d.ticket.external_id?' · '+esc(d.ticket.external_id):''}</span>
    </div>
    <div class="mbody">
      <div class="sec"><h3>The request, exactly as it arrived</h3>
        <div class="req">${esc(d.ticket.text)}</div></div>
      <div class="sec"><h3>What it worked out</h3>
        <div class="facts">
          <div class="f"><div class="k">Who sent it</div><div class="v">${who}</div></div>
          <div class="f"><div class="k">What kind</div><div class="v">${esc(CATEGORY[x.category]||cap(x.category))}</div>
            <div class="s">confidence ${x.category_confidence.toFixed(2)}${moved('category')?` · model first said “${esc(cap(L.category))}”`:''}</div></div>
          <div class="f"><div class="k">How urgent</div><div class="v ${x.urgency}">${esc(URGENCY[x.urgency]||x.urgency)}</div>
            ${x.urgency_signals.length?`<div class="s">From the text:</div>${x.urgency_signals.slice(0,3).map(g=>{
              const t=g.length>44?g.slice(0,42).trim()+'…':g;return `<span class="sig" title="${esc(g)}">${esc(t)}</span>`}).join('')}`:''}
            ${moved('urgency')?`<div class="s">model first said “${esc(L.urgency)}”</div>`:''}</div>
          <div class="f"><div class="k">Needs a human?</div>
            <div class="v ${x.escalate?'yes':'none'}">${x.escalate?'Yes':'No'}</div>
            <div class="s">${x.escalate?'Because '+x.escalation_reasons.map(r=>REASON[r]||cap(r)).join(', and ')+'.'
              :'Nothing here is a security, legal, or executive matter.'}
              ${moved('escalate')?` Model first said ${L.escalate?'yes':'no'}.`:''}</div></div>
        </div></div>
      <div class="dest"><span class="k">So it goes to</span>
        <span class="qp">${esc(d.queue)}</span>
        ${d.escalation_queue?`<span style="color:var(--faint);font-size:12.5px">and a copy to</span>
          <span class="qp esc">${esc(d.escalation_queue)}</span>`:''}</div>
      <div class="sec"><h3>Why it read it that way</h3><div class="prose">${esc(x.rationale)}</div></div>
      <div class="sec"><h3>The safety net</h3>${guard}</div>
      ${d.error?`<div class="sec"><h3>The model call failed, so keyword rules handled it</h3>
        <div class="note"><code>${esc(d.error)}</code></div></div>`:''}
      <div class="meta">
        <span>read by ${esc(d.model||'keyword rules')}</span>
        <span>took ${esc(took(d.latency_ms))}</span>
        <span>${esc(ago(d.created_at))}</span>
        ${d.usage&&d.usage.input_tokens?`<span>${d.usage.input_tokens} in / ${d.usage.output_tokens} out tokens</span>`:''}
        ${d.usage&&d.usage.cache_read_input_tokens?`<span>${d.usage.cache_read_input_tokens} cached</span>`:''}
      </div>
      <details><summary>Full audit record</summary><pre>${esc(JSON.stringify(d,null,2))}</pre></details>
    </div>`;
  $('#mx').onclick=closeModal;
  $('#mprev').onclick=()=>i>0&&openModal(v[i-1].id);
  $('#mnext').onclick=()=>i<v.length-1&&openModal(v[i+1].id);
  $('#modal').scrollTop=0; $('#scrim').scrollTop=0;
}
function closeModal(){
  openId=null; $('#scrim').classList.remove('on'); document.body.style.overflow='';
  const u=new URL(location); u.searchParams.delete('t'); history.replaceState(null,'',u);
}
$('#scrim').onclick=e=>{if(e.target===$('#scrim')) closeModal()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&openId) return closeModal();
  if(!openId||['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName)) return;
  const v=visible(), i=v.findIndex(r=>r.id===openId);
  if((e.key==='ArrowRight'||e.key==='j')&&i<v.length-1){e.preventDefault();openModal(v[i+1].id)}
  if((e.key==='ArrowLeft'||e.key==='k')&&i>0){e.preventDefault();openModal(v[i-1].id)}
});

/* ── actions ───────────────────────────────────────────────────────────── */
async function reload(){rows=await api('/tickets?limit=300'); renderList();}
async function run(fn){busy(true);try{await fn()}catch(e){status(e.message,{err:true,hold:9000})}finally{busy(false)}}

async function loadFixture(name,label){
  await run(async()=>{
    const before=(await api('/queues')).total;
    status(`Reading ${label}… a few seconds per ticket`,{spin:true});
    let done=false;
    const poll=setInterval(async()=>{if(done)return;
      try{const n=(await api('/queues')).total-before;
        if(n>0) status(`Read ${n} of ${label}…`,{spin:true});
        await reload()}catch{}},1500);
    let r; try{r=await api('/tickets/load-samples?fixture='+name,{method:'POST'})}
    finally{done=true;clearInterval(poll)}
    const added=(await api('/queues')).total-before;
    await reload();
    const failed=r.decisions.filter(d=>d.error).length;
    if(failed) status(`${failed} of ${r.count} fell back to keyword rules — open one to see the error.`,{err:true,hold:9000});
    else if(added===0) status(`Those ${r.count} tickets were already read — showing them. Press Clear all to run them again.`,{hold:8000});
    else status(`Read ${added} ticket${added===1?'':'s'}.`,{hold:4000});
  });
}
$('#submit').onclick=()=>run(async()=>{
  const t=$('#text').value.trim(); if(!t) return;
  status('Reading it…',{spin:true});
  const d=await api('/tickets',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({text:t,source:'ui'})});
  $('#text').value=''; $('#text').style.height='';
  escOnly=false; sortBy='newest'; $('#sort').value='newest';
  $('#f-all').classList.add('on'); $('#f-esc').classList.remove('on');
  await reload(); await openModal(d.id);
  if(d.error) status('The model call failed — keyword rules handled it.',{err:true,hold:7000}); else status('');
});
$('#samples').onclick=()=>loadFixture('samples','10 samples');
$('#demo').onclick=()=>loadFixture('demo','32 demo tickets');
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const fd=new FormData();fd.append('file',f);
  run(async()=>{status(`Reading ${f.name}…`,{spin:true});
    const r=await api('/tickets/upload',{method:'POST',body:fd});
    await reload();status(`Read ${r.count} tickets from ${f.name}.`,{hold:4000})})
  .finally(()=>{e.target.value=''})};
$('#clear').onclick=()=>{if(!confirm('Delete every decision from the audit log?'))return;
  run(async()=>{await api('/tickets',{method:'DELETE'});closeModal();await reload();
    status('Cleared.',{hold:2500})})};
$('#f-all').onclick=()=>{escOnly=false;$('#f-all').classList.add('on');$('#f-esc').classList.remove('on');renderList()};
$('#f-esc').onclick=()=>{escOnly=true;$('#f-esc').classList.add('on');$('#f-all').classList.remove('on');renderList()};
$('#sort').onchange=e=>{sortBy=e.target.value;renderList()};

const ta=$('#text');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,150)+'px'});
ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')$('#submit').click()});

(async()=>{
  const h=await api('/health'), m=$('#mode'), live=h.mode==='llm';
  m.className='mode'+(live?'':' off');
  m.textContent=live?`reading with ${h.model}`:'no API key — keyword rules only';
  await reload();
  const want=new URL(location).searchParams.get('t');
  if(want && rows.some(r=>r.id===want)) openModal(want);
})();
</script>
