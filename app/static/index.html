<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>{s=String(s).replace(/_/g,' ');return s[0].toUpperCase()+s.slice(1)};
// Cost is recorded per decision by app/pricing.py, so the page never owns a rate card.
const costOf=d=>(d.usage&&typeof d.usage.cost_usd==='number')?d.usage.cost_usd:null;
const cents=v=>v==null?null:(v*100<1?`${(v*100).toFixed(3)}\u00a2`:`$${v.toFixed(3)}`);
let rows=[], escOnly=false, sortBy='newest', openId=null, view='list';
let pick=null;   // {kind:'urgency'|'category'|'critical', value} — set by clicking a stat

// What each simulated downstream queue is for. Shown on the board so a reviewer can see the
// routing table's intent, not just its output.
const QUEUE_PURPOSE={
  'billing-support':'billing team, normal queue',
  'billing-oncall':'billing, paged — money moving wrongly',
  'engineering-triage':'product bugs, normal queue',
  'engineering-oncall':'paged — critical defects',
  'security-incident-response':'security team, always paged',
  'legal-and-account-management':'legal + the account owner',
  'customer-success':'the account team',
  'product-feedback':'product, no SLA',
  'spam-review':'discarded after a glance',
  'general-support':'front line',
  'human-review':'a person decides — the classifier was unsure',
  'human-escalation-desk':'a human must see this, on top of its own team',
};

const CATEGORY={billing:'A billing question',bug:'Something is broken',security:'A security problem',
  legal_contract:'A contract or legal matter',onboarding:'An onboarding or delivery issue',
  feature_request:'A request for something new',spam:'Spam — not a real request',other:'A general question'};
const URGENCY={low:'Low — whenever',medium:'Medium — normal queue',
  high:'High — there is a deadline or real impact',critical:'Critical — money or many people affected right now'};
const REASON={security_incident:'a possible security incident',data_exposure:'data was exposed to the wrong people',
  legal_threat:'a legal or contract threat',compliance_request:'a regulatory demand with a deadline',
  executive_mention:'an executive is involved'};
const RANK={critical:3,high:2,medium:1,low:0};


/* ── Field explainers. Each answers: what are the criteria, what did we find here, and
      what was the judgment call behind the rule. Written to be read aloud in a demo. ── */
const CATEGORY_DEFS=[
  ['billing','charges, invoices, refunds, plan changes, pricing, seats, renewals with no legal threat'],
  ['bug','something in the product is broken or behaving wrongly'],
  ['security','unauthorised access, credentials, data exposure, vulnerabilities, phishing'],
  ['legal_contract','contract disputes, breach claims, legal threats, regulatory demands'],
  ['onboarding','implementation, setup, go-live progress for an account'],
  ['feature_request','asking for capability that does not exist, limit increases, roadmap'],
  ['spam','nonsense, solicitations, trolling — a real answer, not a failure'],
  ['other','legitimate but fits nothing above'],
];
// Most severe first, everywhere it is shown.
const URGENCY_DEFS=[
  ['critical','money moving wrongly, or many people blocked, right now'],
  ['high','a stated deadline, or material impact on one customer'],
  ['medium','a real request with no deadline and contained impact'],
  ['low','cosmetic or explicitly "whenever you get a chance"'],
];
const URGENCY_CRITERIA=[
  ['A deadline',
   'A date the customer is working to, stated or implied \u2014 "due Friday", "before the 30th", "by end of day". '
   +'A real deadline lifts a ticket to at least high, because missing it is a cost even if nothing is broken.'],
  ['Money at stake',
   'How much, and whose. Their own money moving wrongly is worse than an invoice question, and money belonging '
   +'to <i>their</i> customers is worse again \u2014 that is a ticket that makes a ticket for someone else.'],
  ['How far it spreads',
   'One person, the whole account, or their end customers. The same bug is medium for one user and critical '
   +'when it reaches everyone, so scope moves the level more than severity of tone does.'],
  ['Whether it keeps happening',
   '"third time this month", "still happening", "since Tuesday". Recurrence says the first fix did not hold, '
   +'and it turns a contained issue into a pattern.'],
  ['Whether harm is ongoing',
   'Is damage still accruing while they write? A double-charge that is still firing is critical; the same '
   +'double-charge, already stopped and now a refund question, is not.'],
];
// Third column is the literal vocabulary the guardrail layer greps for, abridged from
// ESCALATION_RULES in app/rules.py. The model decides these five topics from meaning; the
// guardrail decides them from words. Showing both is the closest thing to a rubric that is
// honest — there are no bands here, a topic either applies or it does not.
const ESC_DEFS=[
  ['security_incident','active or suspected unauthorised access, credentials not revoked, phishing, vulnerability reports',
   'unauthorised \u00b7 credentials \u00b7 former employee \u00b7 compromised \u00b7 phishing \u00b7 MFA \u00b7 audit log \u00b7 vulnerability \u00b7 CVE \u00b7 IDOR \u00b7 exploit'],
  ['data_exposure','they saw data belonging to someone else, or theirs was exposed',
   "another customer's records \u00b7 exposed \u2026 data \u00b7 data leak \u00b7 leaked \u00b7 permissions issue \u00b7 visible to everyone"],
  ['legal_threat','legal review, breach of contract, MSA disputes, attorneys',
   'legal team \u00b7 lawyer \u00b7 attorney \u00b7 lawsuit \u00b7 litigation \u00b7 in breach of \u00b7 MSA \u00b7 arbitration \u00b7 cease and desist'],
  ['compliance_request','GDPR, CCPA and similar demands carrying statutory deadlines',
   'GDPR \u00b7 CCPA \u00b7 HIPAA \u00b7 DSAR \u00b7 data subject \u00b7 right to erasure \u00b7 regulator'],
  ['executive_mention','a C-level, VP, founder, board or leadership team named on either side',
   'CEO \u00b7 CFO \u00b7 CTO \u00b7 CISO \u00b7 founder \u00b7 VP \u00b7 chief \u2026 officer \u00b7 the board \u00b7 general counsel'],
];

// A dot means "this one applies to this ticket". Lists where nothing is selected get no dots —
// five permanently empty circles read as a broken control, which is worse than no control.
const DEFAULT_QUEUE={billing:'billing-support',bug:'engineering-triage',security:'security-incident-response',
  legal_contract:'legal-and-account-management',onboarding:'customer-success',
  feature_request:'product-feedback',spam:'spam-review',other:'general-support'};
const routeDefault=c=>DEFAULT_QUEUE[c];
// The category split as a proportional bar. A number people have to compare in their head is a
// number they do not compare; a bar they read in one glance.
function shareBar(x){
  const alts=(x.category_alternatives||[]);
  if(!alts.length) return '';
  const parts=[{c:x.category,v:x.category_confidence,main:true},
               ...alts.map(a=>({c:a.category,v:a.confidence,main:false}))];
  const total=parts.reduce((s,p)=>s+p.v,0)||1;
  return `<div class="share" title="${esc(parts.map(p=>cap(p.c)+' '+p.v.toFixed(2)).join(' · '))}">
    ${parts.map(p=>`<i class="${p.main?'main':''}" style="width:${(p.v/total*100).toFixed(1)}%"></i>`).join('')}
  </div><div class="s">${parts.map(p=>`${p.main?'<b>':''}${esc(cap(p.c))} ${Math.round(p.v/total*100)}%${p.main?'</b>':''}`).join(' · ')}</div>`;
}
function li(label,desc,hit){return `<li class="${hit?'hit':''}"><b>${esc(label)}</b> <span>— ${esc(desc)}</span></li>`}
function liTrig(label,desc,trig,hit){return `<li class="${hit?'hit':''}"><b>${esc(label)}</b> <span>— ${esc(desc)}</span>
  <div class="trig">keywords: ${esc(trig)}</div></li>`}
// The description is our own static copy, not ticket text, so it may carry markup. Labels are still
// escaped out of habit — the day one of these comes from data, the escaping is already there.
function ref(items){return `<ul class="ref">${items.map(([k,v])=>
  `<li><b>${esc(k)}</b><span>${v}</span></li>`).join('')}</ul>`}

// The questions a panel actually asks about each field, answered in the place the question occurs
// to them. Sourced from docs/PANEL-QA.md so the page and the prep doc cannot drift apart.
const FAQ={
  who:[
    ['How do you know it is not inventing a customer?',
     'The schema forbids it. <code>name</code> is null unless the company is written in the ticket verbatim; '
     +'anything inferred goes in <code>best_guess</code> with its own score and the cues it rests on. A guess '
     +'has no path to becoming a name — they are different fields all the way through the audit record.'],
    ['Then why guess at all?',
     '"Unknown" routes nowhere and tells a human nothing. "Enterprise account using the export feature" is '
     +'enough for someone to pick the ticket up, and it is labelled as an inference so nobody treats it as fact.'],
    ['Is there a number behind "it does not invent customers"?',
     'Yes. On the 33-ticket gold set: customer-name accuracy <b>100%</b>, counting the tickets where the '
     +'right answer is null, and <b>zero overclaimed sender confidence</b> — a scored safety check that '
     +'fails if a guess is priced above the band its evidence supports. Every guess carried its basis. '
     +'<code>docs/EVAL-llm.md</code>.'],
    ['Is that number a probability?',
     'No. It is a band read off the rubric above, self-reported by the model. It has never been validated '
     +'against outcomes, so it is a statement of how much the text supports the guess — not a frequency.'],
    ['Two tickets from the same company — would you know?',
     'Not yet. The audit table has no tenant column because the sample tickets carry no customer identity. '
     +'It is the first thing to add the moment there is an auth context.'],
  ],
  what:[
    ['What if a ticket is genuinely two categories?',
     'It says so. The runner-up is named with its share and a clause on what rules it out. Below 0.50 the '
     +'ticket goes to <code>human-review</code> instead of being forced into a team’s queue.'],
    ['Why is spam a category rather than a failure?',
     'Because it is a real answer. If spam were "could not classify", every genuine miss would hide in the '
     +'same bucket as the junk, and the review queue would be useless.'],
    ['How often is the category right?',
     '<b>100%</b> on the 33-ticket gold set, in both modes — scored ambiguity-aware, meaning a ticket the '
     +'gold set marks as legitimately two categories counts as correct for either. Eight of the 33 are marked '
     +'ambiguous on category, so the headline is not 33 easy calls.'],
    ['Who chose 0.50?',
     'I did. It is the only number in the system that changes behaviour, and it lives in '
     +'<code>app/routing.yaml</code> as one line a support lead can move without an engineer.'],
    ['Would you trust the confidence number?',
     'As a share of opinion, yes. As a calibrated probability, no — and the interface never calls it one. '
     +'Calibrating it would need labelled outcomes this system has not collected.'],
  ],
  urgency:[
    ['Does high urgency escalate?',
     'No, and that is deliberate. Urgency is speed; escalation is topic. A full outage is critical and pages '
     +'on-call without escalating. A CEO thank-you note escalates at low urgency.'],
    ['Is urgency not just subjective?',
     'It is a judgment, which is why the criteria are written down and the cues are quoted from the ticket. '
     +'You can disagree with the call and still audit how it was reached.'],
    ['Could an angry customer inflate it?',
     'Tone is not one of the criteria, and the gold set checks it. <code>edge-21</code> — "This is '
     +'ridiculous. Third month in a row the invoice total doesn\u2019t match our plan!!!" — is scored '
     +'medium, carried there by the recurrence, not the shouting. <code>climb-10</code> is the mirror: a calm '
     +'report of a checkout charging customers twice is critical. The signals are facts about impact, not '
     +'temperature.'],
    ['How accurate is the urgency call?',
     'Accuracy is the wrong question here, and the scorecard answers the right one instead. Exact agreement '
     +'is 82% on the model path and 76% rules-only — the weakest numbers in the system. But an urgency '
     +'call is a <b>screening test</b>, and a screening test is not judged on accuracy. Calling a well patient '
     +'sick costs a second look. Calling a sick patient well costs the thing you built the test for.'],
    ['So which way does it get them wrong?',
     'Always the safe way, on this gold set. <b>Under-called (said calmer than gold): 0%.</b> Over-called: 18% '
     +'on the model path, 24% rules-only. No ticket the gold set calls critical was ever read as anything '
     +'less. Every one of those misses is a ticket that reached a queue faster than it strictly needed to, '
     +'where a person downgrades it in seconds — not one that sat. <code>docs/EVAL-llm.md</code> reports '
     +'under-calls and over-calls as separate rows for exactly this reason.'],
    ['Why does rules-only over-call more?',
     'Because it should. 24% against the model’s 18% is the deterministic layer being deliberately '
     +'twitchy: it matches words, cannot weigh context, and is built to fail upward. The model is the more '
     +'precise reader; the rules are the floor under it. Neither has ever under-called.'],
    ['Is that not just a tolerant gold set?',
     'The scorecard reports the strict version too: under-calls on tickets the gold set does <i>not</i> mark '
     +'ambiguous on urgency. That row reads <b>none</b> in both modes. Urgency is where the gold set concedes '
     +'the most — 20 of 33 rows are marked ambiguous, against 8 on category and 5 on escalate — '
     +'because low versus medium is genuinely arguable. The under-call number does not depend on that '
     +'concession.'],
  ],
  human:[
    ['Why not let the model decide escalation on its own?',
     'Because a missed escalation is the one failure that is unacceptable, and a prompt change can quietly '
     +'move a model’s behaviour. The keyword layer is a floor that cannot drift: it is version-controlled, '
     +'testable, and only ever raises.'],
    ['Then why not just rules?',
     'Rules cannot read "our data reached the wrong audience" without the word breach in it. The model catches '
     +'meaning; the regexes catch words. Neither alone covers both.'],
    ['Are you optimising for recall or precision?',
     'Recall, explicitly, and the whole design says so. A missed escalation is a breach nobody looked at; a '
     +'false one is a minute of someone’s afternoon. So the keyword layer may only ever <i>raise</i> a '
     +'ticket, the gold set tolerates over-escalation on marked rows and never tolerates a miss, and urgency '
     +'is scored by direction rather than by accuracy. The cost of the two errors is not symmetric — so the '
     +'metrics are not either.'],
    ['What is the false-positive rate?',
     'Zero, on 22 chances. The 33-ticket gold set splits 11 must-escalate / 22 must-not, and both the model '
     +'path and rules-only mode score <b>100% escalation recall with zero false escalations</b> — the '
     +'must-not half is where a false positive would show up. The traps are deliberate: a SOC 2 report '
     +'request (<code>edge-28</code>), a contract-renewal pricing question (<code>edge-25</code>) and an '
     +'invoice copied to a legal department (<code>edge-11</code>) all carry the vocabulary and none of them '
     +'escalate. Numbers in <code>docs/EVAL-llm.md</code> and <code>docs/EVAL-rules.md</code>.'],
    ['Does the flag hold still between runs?',
     'Measured, not assumed: <code>scripts/repeatability.py</code> ran four tickets three times each and the '
     +'escalation flag and category label were unanimous 4/4, with confidence standard deviation averaging '
     +'0.046. Nothing is pinned — no seed, no temperature control — so that is the natural spread. '
     +'The <b>Read it again</b> button lower down runs the same check live on this ticket.'],
    ['Why escalate a security ticket that already goes to security?',
     'Countability. A ticket sitting in the security queue looks identical whether it is a breach or a '
     +'question about the SOC 2 report. Without the flag, "did we miss one" has no answer.'],
  ],
  route:[
    ['Is this a real queue?',
     'Simulated, as the brief asks. A queue is a name in <code>app/routing.yaml</code> and a field on the '
     +'decision. Pointing it at Zendesk, Jira or PagerDuty is one adapter behind the same call — the '
     +'routing logic does not change.'],
    ['Why copy an escalated ticket instead of moving it?',
     'If it moved, the owning team would never see it. Both get it, and whoever acts first owns it. Moving '
     +'would turn an escalation into a handoff, which is how things get dropped.'],
    ['Who changes routing?',
     'Support leads, in YAML, without an engineer. That is why the table is data and not code — routing '
     +'changes far more often than logic does.'],
  ],
};
function faq(key){
  const qs=FAQ[key]; if(!qs) return '';
  return `<h5>Questions people ask about this</h5><div class="faq">${qs.map(([q,a])=>
    `<details><summary>${esc(q)}</summary><div>${a}</div></details>`).join('')}</div>`;
}

// Every pop-out reads in the same order, and the order is the one a reviewer asks in:
//   1. the ticket, so the thing being explained is never off-screen
//   2. THE DECISION — what this service concluded, stated first
//   3. the evidence behind it — why this ticket read that way
//   4. the rubric — the bands, criteria or table the decision was made against
// Reference material last. Leading with a rubric makes a reader hunt for the answer.
function explainer(key,d){
  const x=d.extraction, c=x.customer;
  const head=()=>`<div class="ticketref">${esc(d.ticket.text)}</div>`;
  // Model-supplied fragments sometimes arrive already quoted; wrapping them again prints ““like this””.
  const q=t=>`“${esc(String(t).replace(/^["“'\s]+|["”'\s]+$/g,''))}”`;
  const call=(label,t)=>`<div class="found lead"><b>${esc(label)}</b>${t}</div>`;
  const why=(txt)=>txt?`<h5>The evidence behind it</h5><p class="reason">${esc(txt)}</p>`:'';

  if(key==='who'){
    const conf=c.confidence, r=conf>=0.95?0:conf>=0.75?1:conf>=0.4?2:conf>0?3:4;
    const RUNGS=[
      ['0.95 – 1.00','the company is named in the text, so this is a fact, not a guess'],
      ['0.75 – 0.94','a work email domain or an account id pins the org without naming it'],
      ['0.40 – 0.74','scale, plan, product surface, industry or a stated role — the shape of the customer'],
      ['0.10 – 0.39','only that they are a customer of some kind'],
      ['0.00','nothing in the text identifies them, and we say so rather than invent one'],
    ];
    return head()
    + call('Who sent it', c.name
        ? `Named outright: <b>${esc(c.name)}</b>${c.contact_name?`, contact ${esc(c.contact_name)}`:''}.`
        : (c.best_guess
          ? `No name given. Best guess <b>${esc(c.best_guess)}</b> at <b>${conf.toFixed(2)}</b>, from ${c.basis.map(q).join(', ')}.`
          : `Nothing in the text identifies the sender.`))
    + why(x.customer_reason)
    + `<h5>The scale that score was read off</h5><ul class="crit">
        ${RUNGS.map(([band,meaning],i)=>li(band,meaning,i===r)).join('')}
       </ul>`
    + `<p class="foot">${d.model
        ? `The score came from <b>${esc(d.model)}</b>, following these bands as an instruction. The band above is read straight off it.`
        : `No model ran. The score is a fixed constant in <code>app/rules.py</code> for whichever cue matched.`}</p>`
    + faq('who');
  }

  if(key==='what'){
    const cc=x.category_confidence;
    const rung=cc>=0.9?0:cc>=0.7?1:cc>=0.5?2:3;
    return head()
    + call('What kind of request', `<b>${esc(cap(x.category))}</b> at <b>${cc.toFixed(2)}</b> — ${
        ['no real alternative','clear, with an arguable neighbour','defensible, the alternative is genuinely arguable',
         'below the bar, so this was diverted to human-review'][rung]}.`)
    + why(x.category_reason)
    + ((x.category_alternatives||[]).length
        ? `<h5>What else was in contention</h5>${shareBar(x)}<ul class="crit">
            ${li(cap(x.category)+' — chosen', `${cc.toFixed(2)} of the weight`, true)}
            ${x.category_alternatives.map(a=>li(cap(a.category), `${a.confidence.toFixed(2)} — ${a.why_not}`, false)).join('')}
           </ul><p style="font-size:11.5px;color:var(--faint);margin:9px 0 0">Read it as: if ten support
           leads filed this ticket, roughly this is how they would split.</p>`
        : `<h5>What else was in contention</h5><div class="note calm">Nothing — only one category fits this ticket.</div>`)
    + `<h5>The scale that score was read off</h5><ul class="crit">
        ${li('0.90 – 1.00','only one category fits; no real alternative',rung===0)}
        ${li('0.70 – 0.89','clear, though a neighbouring category is arguable',rung===1)}
        ${li('0.50 – 0.69','defensible, and a reasonable person could pick the other one',rung===2)}
        ${li('below 0.50','not confident enough to send to a team — goes to human-review instead',rung===3)}
       </ul>`
    + `<h5>The eight categories</h5><ul class="crit">${CATEGORY_DEFS.map(([k,v])=>li(cap(k),v,k===x.category)).join('')}</ul>`
    + faq('what');
  }

  if(key==='urgency') return head()
    + call('How urgent', x.urgency_signals.length
        ? `<b>${esc(cap(x.urgency))}</b>, read from ${x.urgency_signals.map(q).join(', ')}.`
        : `<b>${esc(cap(x.urgency))}</b>, with no explicit cue in the text.`)
    + why(x.urgency_reason)
    + `<h5>The four levels <span style="text-transform:none;letter-spacing:0;font-weight:400">— the filled one is this ticket</span></h5>`
    + `<ul class="crit">${URGENCY_DEFS.map(([k,v])=>li(cap(k),v,k===x.urgency)).join('')}</ul>`
    + `<h5>The five things the level is read from</h5>
       <p style="font-size:12px;color:var(--dim);margin:0 0 9px;line-height:1.6">Urgency is never stated
       in a ticket — nobody writes “this is a medium”. It has to be inferred, and these are the
       five signals the model is told to weigh. Any one of them can carry a ticket up a level on its own.</p>
       ${ref(URGENCY_CRITERIA)}
       <p class="foot">Tone is not on the list, deliberately. An angry message about a routine billing
       error is still medium; a calm message about double-charging 1,900 end customers is critical.
       Reading past the tone to the facts is the part a word list cannot do.</p>`
    + faq('urgency');

  if(key==='human') return head()
    + call('Does it escalate', x.escalate
        ? `<b>Yes</b> — ${x.escalation_reasons.map(r=>`<b>${esc(cap(r))}</b>`).join(' and ')}. Copied to <code>${esc(d.escalation_queue||'the escalation desk')}</code> on top of <code>${esc(d.queue)}</code>.`
        : `<b>No</b>. None of the five topics applied, so it goes to <code>${esc(d.queue)}</code> and nowhere else.`)
    + why(x.escalation_reason_text)
    + `<h5>The five escalation topics</h5><ul class="crit">${ESC_DEFS.map(([k,v,t])=>
        liTrig(cap(k),v,t,x.escalation_reasons.includes(k))).join('')}</ul>
       <p style="font-size:11.5px;color:var(--faint);margin:9px 0 0">Both halves read the same five
       topics. The model reads them from meaning, so it catches “our VP of Engineering is asking”
       with no keyword in sight. The keywords run separately, over the raw ticket, and catch what the
       model played down. Either half alone is enough to raise the flag; neither can lower it.</p>`
    + `<h5>Who ends up involved — four things that get confused for each other</h5><ul class="crit">
        ${li('Its own team','always. Every ticket is routed to a queue a person works.',true)}
        ${li('On-call, paged now','when urgency is critical. This ticket: '+esc(x.urgency)+'.',x.urgency==='critical')}
        ${li('The escalation desk, on top of its team','only for the five topics above.',x.escalate)}
        ${li('Human review instead of a team','only when the classifier was too unsure to pick one.',d.queue==='human-review')}
       </ul>
       <p style="font-size:11.5px;color:var(--faint);margin:9px 0 0">A checkout bug double-charging
       customers is critical and gets paged to engineering on-call within minutes — and still does
       not escalate, because it is a product defect, not a security or legal matter. Speed and
       escalation are separate dials.</p>`
    + `<p class="foot">${x.escalate && d.queue && d.queue.includes('security')
        ? `Security would treat this as an incident anyway, so the copy is belt-and-braces. What the flag adds here is <b>countability</b> — a ticket in the security queue looks the same whether it is a breach or a question about the SOC 2 report, and without a flag “did we miss one” has no answer.`
        : x.escalate
        ? `This is where the flag does real work: <code>${esc(d.queue)}</code> would handle it as ordinary ${esc(cap(x.category))} work, and nobody outside that team would learn about it. The copy is the only signal.`
        : `Routing asks who handles it. The flag asks whether anyone outside that team needs to know. Here, no.`}</p>`
    + faq('human');

  if(key==='route'){
    const cc=x.category_confidence, diverted=d.queue==='human-review';
    const step=(n,label,val,note)=>`<li class="hit"><b>${esc(label)}</b> <span>${esc(note)}</span>
      <div style="margin-top:4px;font:600 12.5px var(--mono);color:var(--text)">${val}</div></li>`;
    // Only some categories have an on-call queue, so "critical" does not always reroute. Infer it
    // from the decision rather than asserting it: if the queue still matches the category default,
    // nothing was rerouted, whatever the urgency says.
    const dflt=routeDefault(x.category);
    const rerouted=x.urgency==='critical' && !diverted && !!dflt && d.queue!==dflt;
    const modifiers=[
      rerouted ? 'critical urgency moved it to <code>'+esc(d.queue)+'</code>' : '',
      diverted ? 'confidence '+cc.toFixed(2)+' is under the 0.50 bar, so it goes to a person rather than a team' : '',
      x.escalate ? 'the escalation flag adds a copy for <code>'+esc(d.escalation_queue)+'</code>' : '',
    ].filter(Boolean);
    return head()
    + call('Where it goes', `<code>${esc(d.queue)}</code>${d.escalation_queue?` and <code>${esc(d.escalation_queue)}</code>`:''}.`)
    + `<h5>The evidence behind it</h5><p class="reason">Nothing was judged here. <b>${esc(cap(x.category))}</b>
       is owned by <code>${esc(dflt||'—')}</code> in the routing table${
       modifiers.length?', then '+modifiers.join(', and '):', and nothing changed that'}.</p>`
    + `<h5>The lookup, step by step</h5><ul class="crit">
        ${step(1,'Start with the category','<code>'+esc(x.category)+'</code>','every category has a default queue')}
        ${step(2,'Look it up in the table',
          '<code>'+esc(x.category)+'</code> → <code>'+esc(diverted?(dflt||'—'):d.queue)+'</code>',
          'from app/routing.yaml')}
        ${step(3,'Does urgency change it?',
          rerouted ? 'critical → <code>'+esc(d.queue)+'</code> instead'
          : x.urgency==='critical' ? 'critical, but <code>'+esc(x.category)+'</code> has no on-call queue → no change'
          : esc(x.urgency)+' → no change',
          'only critical reroutes, and only for categories that have an on-call queue')}
        ${step(4,'Is the classifier confident enough?',
          diverted ? cc.toFixed(2)+' is below 0.50 → <code>human-review</code>'
                   : cc.toFixed(2)+' is above 0.50 → keep the queue',
          'an unsure ticket goes to a person, not a team')}
        ${step(5,'Does a human need a copy?',
          x.escalate ? 'yes → also <code>'+esc(d.escalation_queue)+'</code>' : 'no → nothing added',
          'escalated tickets are copied, never moved — the owning team still sees them')}
       </ul>`
    + `<p class="foot">The table lives in <code>app/routing.yaml</code> as data, not code, because support
       leads change routing far more often than engineers change logic.</p>`
    + faq('route');
  }
  return '';
}

async function api(p,o={}){const r=await fetch(p,o);
  if(!r.ok) throw new Error((await r.text()).slice(0,240));
  return r.headers.get('content-type')?.includes('json')?r.json():r.text();}

let st;
function status(msg,{spin=false,err=false,hold=0}={}){
  clearTimeout(st); const el=$('#status');
  if(!msg){el.classList.remove('on','err');return}
  $('#statustext').innerHTML=(spin?'<span class="spin"></span>':'')+esc(msg);
  el.classList.add('on'); el.classList.toggle('err',err);
  if(hold) st=setTimeout(()=>el.classList.remove('on','err'),hold);
}
function busy(on){document.querySelectorAll('.composer button,.menu-pop button,#menubtn').forEach(b=>b.disabled=on)}
function closeMenu(){$('#menupop').classList.remove('on');$('#showpop').classList.remove('on')}
function ago(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
const took=ms=>ms<1000?ms+' ms':(ms/1000).toFixed(1)+' s';

const SORTS={
  newest:(a,b)=>(b.created_at||'').localeCompare(a.created_at||''),
  urgency:(a,b)=>{const x=a.extraction,y=b.extraction;
    if(x.escalate!==y.escalate) return x.escalate?-1:1;
    if(RANK[y.urgency]!==RANK[x.urgency]) return RANK[y.urgency]-RANK[x.urgency];
    return SORTS.newest(a,b)},
  slowest:(a,b)=>b.latency_ms-a.latency_ms,
  fastest:(a,b)=>a.latency_ms-b.latency_ms,
  category:(a,b)=>a.extraction.category.localeCompare(b.extraction.category)||SORTS.urgency(a,b),
};
function matchesPick(d){
  if(!pick) return true;
  if(pick.kind==='urgency')  return d.extraction.urgency===pick.value;
  if(pick.kind==='category') return d.extraction.category===pick.value;
  if(pick.kind==='critical') return d.extraction.urgency==='critical';
  if(pick.kind==='queue')    return d.queue===pick.value || d.escalation_queue===pick.value;
  return true;
}
const visible=()=>(escOnly?rows.filter(d=>d.extraction.escalate):rows)
  .filter(matchesPick).slice().sort(SORTS[sortBy]);

// What every field in the audit record is for. This is the thing an auditor reads six months later,
// so each row says what it holds and who uses it.
const AUDIT_FIELDS=[
 ['id','The decision id. Appears in the JSON log line and in the shareable URL for this ticket.'],
 ['created_at','When the decision was made, UTC. The audit table is indexed on it.'],
 ['ticket.source','Where it came from — the web form, an upload, an API client. Half of the idempotency key.'],
 ['ticket.external_id','The sending system\u2019s own id. The other half of the idempotency key: resubmitting returns this same decision rather than making a second one.'],
 ['mode','Which path produced it: <code>llm</code>, or <code>llm_fallback_rules</code> when the model failed and keyword rules stepped in.'],
 ['model','The exact model version. Pinned here so a decision can be reproduced against the model that made it.'],
 ['extraction','What shipped — the fields the downstream queue acts on.'],
 ['llm_extraction','What the model said <i>before</i> the guardrails ran. Keeping both is what makes "did a rule change this?" answerable.'],
 ['rule_hits','Every guardrail that matched, with the exact text it matched on.'],
 ['overrides','The changes those rules made, in order. Empty when nothing moved.'],
 ['queue / escalation_queue','Where it was routed, and the human copy if there was one.'],
 ['latency_ms','Wall time for the whole decision, including retries.'],
 ['usage','Tokens in and out, how many were cached, and reasoning tokens — this is the cost of the decision.'],
 ['error','Present only when the model call failed. The reason the fallback ran.'],
];
function auditTable(d){
  const get=(k)=>{const v=k.split('.').reduce((o,p)=>o&&o[p],d);
    return v===undefined||v===null?'—':(typeof v==='object'?`{${Object.keys(v).length} fields}`:String(v));};
  return `<table class="audit">${AUDIT_FIELDS.map(([k,desc])=>{
    const first=k.split(' / ')[0];
    return `<tr><th>${esc(k)}</th><td class="v">${esc(get(first)).slice(0,60)}</td><td class="d">${desc}</td></tr>`;
  }).join('')}</table>`;
}

function ticketCard(d){
  const x=d.extraction;
  return `<div class="tk ${x.urgency} ${x.escalate?'esc':''}" data-id="${d.id}">
      <div class="m"><span class="c">${esc(cap(x.category))}</span>
        <span class="u ${x.urgency}">${esc(x.urgency)}</span>
        ${x.escalate?'<span class="flag">Escalated</span>':''}
        ${d.mode!=='llm'?'<span class="degraded" title="Classified by keyword rules, not the model">keyword rules</span>':''}</div>
      <div class="t">${esc(d.ticket.text)}</div>
      <div class="q">→ ${esc(d.queue)}${d.escalation_queue?' + '+esc(d.escalation_queue):''}</div>
      <div class="side">
        <span class="when">${esc(ago(d.created_at))}</span>
        <span class="took">${esc(took(d.latency_ms))}</span>
        <span class="open">Open ↗</span>
      </div>
    </div>`;
}

function renderQueueBoard(){
  const v=visible();
  const byQueue={};
  Object.keys(QUEUE_PURPOSE).forEach(q=>byQueue[q]=[]);
  v.forEach(d=>{
    (byQueue[d.queue] = byQueue[d.queue] || []).push(d);
    if(d.escalation_queue) (byQueue[d.escalation_queue] = byQueue[d.escalation_queue] || []).push(d);
  });
  const filtered=!!pick||escOnly;
  const names=Object.keys(byQueue)
    .filter(q=>!filtered||byQueue[q].length)
    .sort((a,b)=>byQueue[b].length-byQueue[a].length||a.localeCompare(b));
  $('#list').innerHTML=names.map(q=>`
    <div class="qgroup ${q.includes('escalation')?'esc':''}">
      <div class="qhead"><span class="name">${esc(q)}</span>
        <span class="n">${byQueue[q].length}</span>
        <span class="desc">${esc(QUEUE_PURPOSE[q]||'')}</span></div>
      ${byQueue[q].length ? byQueue[q].map(ticketCard).join('')
        : '<div class="qempty">empty — nothing routed here</div>'}
    </div>`).join('');
  document.querySelectorAll('.tk').forEach(t=>t.onclick=()=>openModal(t.dataset.id));
}

const URG_COLOR={low:'#cdcdc0',medium:'#8dbfc9',high:'#b75238',critical:'#92351e'};
const CAT_COLOR={billing:'#006172',bug:'#8dbfc9',security:'#92351e',legal_contract:'#b75238',
  onboarding:'#87a48c',feature_request:'#c6f0cd',spam:'#cdcdc0',other:'#e4e4d8'};

// The shape of the pile, before you read any single ticket.
function renderOverview(){
  const el=$('#overview');
  if(!rows.length){el.classList.remove('on');return}
  el.classList.add('on');
  const esc_n=rows.filter(d=>d.extraction.escalate).length;
  const crit=rows.filter(d=>d.extraction.urgency==='critical').length;
  const lat=rows.map(d=>d.latency_ms).sort((a,b)=>a-b);
  const p50=lat[Math.floor(lat.length/2)];
  const costs=rows.map(costOf).filter(v=>v!=null);
  const priced=costs.length, spend=priced?costs.reduce((a,b)=>a+b,0):null;
  const count=(key,get)=>{const m={};rows.forEach(d=>{const v=get(d);m[v]=(m[v]||0)+1});return m};
  const URG_ORDER=['critical','high','medium','low'];
  const bar=(m,colors,kind)=>{
    const keys=Object.keys(m).sort(kind==='urgency'
      ? (a,b)=>URG_ORDER.indexOf(a)-URG_ORDER.indexOf(b)   // severity, not popularity
      : (a,b)=>m[b]-m[a]);
    const on=k=>pick&&pick.kind===kind&&pick.value===k;
    return `<div class="dist">${keys.map(k=>`<i data-pick="${kind}:${esc(k)}" class="${on(k)?'sel':''}" style="width:${m[k]/rows.length*100}%;background:${colors[k]||'#cdcdc0'}" title="${esc(cap(k))} ${m[k]} — click to filter"></i>`).join('')}</div>
      <div class="legend">${keys.map(k=>`<span class="pickable ${on(k)?'on':''}" data-pick="${kind}:${esc(k)}"><b style="background:${colors[k]||'#cdcdc0'}"></b>${esc(cap(k))} ${m[k]}</span>`).join('')}</div>`;
  };
  el.innerHTML=`
    <div class="ov pickcard ${!pick&&!escOnly?'on':''}" data-pick="all:1"><div class="k">Tickets read</div>
      <div class="big">${rows.length}</div>
      <div class="legend" style="margin-top:8px"><span>${rows.filter(d=>d.mode==='llm').length} by the model</span></div></div>
    <div class="ov pickcard ${escOnly?'on':''}" data-pick="escalated:1"><div class="k">Needing a human</div>
      <div class="big danger">${esc_n}<small>${Math.round(esc_n/rows.length*100)}% escalated</small></div>
      <div class="legend" style="margin-top:8px"><span class="pickable ${pick&&pick.kind==='critical'?'on':''}" data-pick="critical:1">${crit} critical</span></div></div>
    <div class="ov"><div class="k">By urgency <span class="hint">click to filter</span></div>
      ${bar(count('u',d=>d.extraction.urgency),URG_COLOR,'urgency')}</div>
    <div class="ov"><div class="k">By category <span class="hint">click to filter</span></div>
      ${bar(count('c',d=>d.extraction.category),CAT_COLOR,'category')}</div>
    ${spend!=null?`<div class="ov"><div class="k">What it cost</div>
      <div class="big">${cents(spend/Math.max(priced,1))}<small>per ticket, average</small></div>
      <div class="legend" style="margin-top:8px"><span>${cents(spend)} for all ${priced} · ${cents(spend/Math.max(priced,1)*1000)} per 1,000</span></div></div>`:''}
    <div class="ov"><div class="k">Time to read one</div>
      <div class="big">${(p50/1000).toFixed(1)}<small>seconds, median</small></div>
      <div class="legend" style="margin-top:8px"><span>${(lat[lat.length-1]/1000).toFixed(1)}s slowest</span></div></div>`;
}

function setView(v){
  view=v;
  $('#v-list').classList.toggle('on',v==='list');
  $('#v-queue').classList.toggle('on',v==='queue');
}

function applyPick(token){
  const [kind,value]=token.split(':');
  if(kind==='all'){pick=null;escOnly=false}
  else if(kind==='escalated'){pick=null;escOnly=!escOnly}
  else if(kind==='critical'){pick=(pick&&pick.kind==='critical')?null:{kind:'critical'}}
  else pick=(pick&&pick.kind===kind&&pick.value===value)?null:{kind,value};
  // A number you click on the dashboard has to take you to the tickets behind it; a filter with
  // nothing visible to filter is a dead control. Clearing it leaves you where you are.
  if(pick||escOnly) setView('queue');
  renderList();
}
function wirePicks(){
  document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); applyPick(el.dataset.pick);
  });
}

const SORT_LABELS=[['newest','Most recent'],['urgency','Most urgent'],
  ['slowest','Longest to read'],['fastest','Quickest to read'],['category','Category']];

// Filter and sort are the same question \u2014 "how do I want to see this list" \u2014 so they live in
// one menu. The counts come from the rows in hand, so a filter never offers an empty view.
function renderShowMenu(){
  const n=k=>rows.filter(k).length;
  const esc_n=n(d=>d.extraction.escalate), crit=n(d=>d.extraction.urgency==='critical');
  const review=n(d=>d.queue==='human-review');
  const on=(t)=>{
    if(t==='all') return !pick&&!escOnly;
    if(t==='escalated:1') return escOnly;
    if(t==='critical:1') return !!pick&&pick.kind==='critical';
    const [k,v]=t.split(':'); return !!pick&&pick.kind===k&&pick.value===v;
  };
  const frow=(token,label,count)=>`<button data-show="pick:${esc(token)}">
    <span class="tick ${on(token)?'':'off'}">\u2713</span>${esc(label)}<span class="n">${count}</span></button>`;
  const srow=([k,label])=>`<button data-show="sort:${k}">
    <span class="tick ${sortBy===k?'':'off'}">\u2713</span>${esc(label)}</button>`;
  $('#showpop').innerHTML =
    `<div class="grp">Filter</div>`
    + frow('all','Everything',rows.length)
    + frow('escalated:1','Needing a human',esc_n)
    + frow('critical:1','Critical',crit)
    + (review?frow('queue:human-review','Sent to human review',review):'')
    + `<div class="grp">Sort</div>` + SORT_LABELS.map(srow).join('');
  document.querySelectorAll('#showpop [data-show]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [kind,...rest]=b.dataset.show.split(':'); const token=rest.join(':');
    if(kind==='sort'){sortBy=token; renderList()}
    else applyPick(token);
    closeMenu();
  });
}

function renderList(){
  renderShowMenu();
  // Two views, one question each. Dashboard is the shape of the pile and carries no tickets.
  // Queues is the tickets themselves, grouped by where they were routed.
  const dash=view==='list';
  if(dash){renderOverview();wirePicks()}
  else {$('#overview').classList.remove('on');$('#overview').innerHTML=''}
  $('#overview').classList.toggle('solo',dash);
  $('#nextstep').innerHTML = dash && rows.length
    ? 'Click any number above to open the tickets behind it, or <b>Queues</b> to see all of them '
      + 'grouped by the team they were routed to.'
    : '';
  const v=visible(), n=rows.filter(d=>d.extraction.escalate).length;
  const label = pick ? (pick.kind==='critical'?'critical':cap(pick.value)) : null;
  $('#count').innerHTML = !rows.length ? ''
    : (label||escOnly)
      ? `<b>${v.length}</b> of ${rows.length} \u00b7 <i>${esc(label||'escalated')}</i> <button class="clearpick" id="clearpick">clear</button>`
      : `<b>${rows.length}</b> tickets \u00b7 <i>${n} need a human</i>`;
  const cp=$('#clearpick'); if(cp) cp.onclick=()=>{pick=null;escOnly=false;renderList()};

  if(!rows.length){
    $('#list').innerHTML=`<div class="empty"><h3>What this does</h3>
       <p>Customer requests arrive as freeform text and nobody labels them. This service reads each one
          and works out <b>who sent it</b>, <b>what kind of request it is</b>, <b>how urgent it is</b>, and
          <b>whether a person needs to see it</b> \u2014 then sends it to the right team.</p>
       <p>To watch it work:</p>
       <ol><li><button class="go" id="seed-now">Load the 10 Climb samples</button> — instant, replayed
               from a recorded run, no API calls.</li>
           <li>Or paste any customer message at the top and press <span class="kbd">Read it</span> to
               have the model read one live.</li></ol>
       <p style="margin-top:14px">Then click any ticket to open the full breakdown.</p></div>`;
    const sn=$('#seed-now'); if(sn) sn.onclick=()=>loadRecorded('samples','Climb samples');
    return;
  }
  if(dash){$('#list').innerHTML='';return}
  if(!v.length){
    $('#list').innerHTML=`<div class="empty"><h3>Nothing here</h3><p>No tickets match this filter.</p></div>`;
    return;
  }
  renderQueueBoard();
}


/* ── modal ─────────────────────────────────────────────────────────────── */
async function openModal(id){
  openId=id;
  const u=new URL(location); u.searchParams.set('t',id); history.replaceState(null,'',u);
  $('#scrim').classList.add('on'); document.body.style.overflow='hidden';
  $('#modal').innerHTML=`<div class="mbody" style="padding:60px;text-align:center;color:var(--faint)">
    <span class="spin" style="display:inline-block"></span></div>`;
  const d=await api('/tickets/'+id), x=d.extraction, L=d.llm_extraction;
  const moved=k=>L&&JSON.stringify(L[k])!==JSON.stringify(x[k]);
  const netChange=L&&['category','urgency','escalate'].some(k=>JSON.stringify(L[k])!==JSON.stringify(x[k]));
  // Render the override trail as a numbered sequence — "what fired, in what order, and what it did"
  // reads very differently from a run-on line of rule names.
  const steps=d.overrides.map((o,i)=>`<div class="step"><span class="n">${i+1}</span><code>${esc(o)}</code></div>`).join('');

  let guard;
  if(d.overrides.length&&(netChange||!L))
    guard=`<div class="note changed"><b>The safety net changed the answer.</b> A keyword rule caught something the
      reading missed. Rules may only make a ticket <i>more</i> urgent or escalated, never less.
      <div class="steps">${steps}</div></div>`;
  else if(d.overrides.length)
    guard=`<div class="note calm"><b>Two rules fired in order, and the second undid the first.</b>
      <div class="steps">${steps}</div>
      <p style="margin:10px 0 0"><b>Net effect: nothing changed.</b> What shipped is exactly what the reading said
      \u2014 ${esc(cap(x.category))}, ${esc(x.urgency)} urgency, ${x.escalate?'escalated':'not escalated'}. A keyword
      rule matched a word in the text and raised the ticket; then a later rule recognised the ticket as
      ${esc(cap(x.category))} and put it back. Every step is kept because an auditor asking \u201cdid anything touch
      this ticket?\u201d deserves the real sequence, not just the outcome.</p></div>`;
  else if(d.rule_hits.length)
    guard=`<div class="note calm"><b>A rule matched, and it agreed with the reading — nothing changed.</b><br>
      ${d.rule_hits.map(h=>`<code>${esc(h.rule)} on “${esc(h.matched)}”</code>`).join('')}</div>`;
  else guard=`<div class="note calm"><b>No rule matched.</b> None of the escalation patterns appear in this
      ticket, so the model's reading ships exactly as it came back.</div>`;

  // What the layer IS, ahead of what it did here. A reader seeing a rule name for the first time
  // needs to know where it came from before the result means anything.
  const guardIntro=`<p class="prose" style="margin:0 0 11px">A second pass, after the model answers.
    About twenty regular expressions in <code>app/rules.py</code> — plain word matching, no model —
    run over the <b>original ticket text</b>, not over what the model said about it, so a word the
    model glossed over still gets seen. Each pattern belongs to one of the five escalation topics.
    <br><br>
    They are allowed to do exactly two things: raise the escalation flag, and lift urgency to a floor.
    They can never lower either, and they never touch the category. That asymmetry is the whole
    design — a missed escalation is the expensive failure, an extra one costs a person a minute
    — so the layer is built to only ever err upward.</p>`;

  // A stated name is a fact. Anything else is an inference, shown with its score and never promoted.
  const conf=x.customer.confidence||0;
  const band=conf>=0.8?'hi':conf>=0.4?'mid':'lo';
  const pill=`<span class="score ${band}">${conf.toFixed(2)}</span>`;
  const who=x.customer.name
    ? `${esc(x.customer.name)}${pill}${x.customer.contact_name?`<div class="s">${esc(x.customer.contact_name)}</div>`:''}<div class="s">Named outright in the ticket.</div>`
    : (x.customer.best_guess
      ? `<span class="guess">${esc(x.customer.best_guess)}</span>${pill}<div class="s">Inferred, not stated. From ${x.customer.basis.slice(0,2).map(b=>`\u201c${esc(String(b).replace(/^["\u201c'\s]+|["\u201d'\s]+$/g,''))}\u201d`).join(', ')||'context'}.</div>`
      : `<span class="none">Unknown</span><span class="score lo">0.00</span><div class="s">Nothing in the text identifies the sender.${x.customer.identifiers.length?' Picked up: '+esc(x.customer.identifiers.join(', ')):''}</div>`);

  const v=visible(), i=v.findIndex(r=>r.id===id);
  $('#modal').innerHTML=`
    <div class="mhead">
      <span class="b">${esc(cap(x.category))}</span>
      <span class="b u-${x.urgency}">${esc(x.urgency)}</span>
      ${x.escalate?'<span class="b esc">Escalated</span>':''}
      ${d.mode!=='llm'?'<span class="b" style="background:#fdf0d8;color:#6b4a12">read by keyword rules, not the model</span>':''}
      <button class="x" id="mx" aria-label="Close">×</button>
    </div>
    <div class="mnav">
      <button id="mprev" ${i<=0?'disabled':''}>← Previous</button>
      <button id="mnext" ${i>=v.length-1?'disabled':''}>Next →</button>
      <span class="pos">${i+1} of ${v.length}${d.ticket.external_id?' · '+esc(d.ticket.external_id):''}</span>
    </div>
    <div class="mbody">
      <div class="sec"><h3>The request, exactly as it arrived</h3>
        <div class="req">${esc(d.ticket.text)}</div></div>
      <h2 class="ssec">1 &middot; What it worked out <span>click any box to open how it decided</span></h2>
      <div class="sec">
        <div class="facts">
          <div class="f" data-x="who"><div class="how">How?</div><div class="k">Who sent it</div><div class="v">${who}</div></div>
          <div class="f" data-x="what"><div class="how">How?</div><div class="k">What kind</div>
            <div class="v">${esc(CATEGORY[x.category]||cap(x.category))}</div>
            <div class="s">confidence ${x.category_confidence.toFixed(2)}${moved('category')?` · model first said “${esc(cap(L.category))}”`:''}</div>
            ${shareBar(x)}</div>
          <div class="f" data-x="urgency"><div class="how">How?</div><div class="k">How urgent</div>
            <div class="v ${x.urgency}">${esc(URGENCY[x.urgency]||x.urgency)}</div>
            ${x.urgency_signals.length?`<div class="s">${x.urgency_signals.length} cue${x.urgency_signals.length>1?'s':''} in the text</div>`:''}
            ${moved('urgency')?`<div class="s">model first said “${esc(L.urgency)}”</div>`:''}</div>
          <div class="f" data-x="human"><div class="how">How?</div><div class="k">Escalate?</div>
            <div class="v ${x.escalate?'yes':'none'}">${x.escalate?'Yes':'No'}</div>
            <div class="s">${x.escalate?'Because '+x.escalation_reasons.map(r=>REASON[r]||cap(r)).join(', and ')+'.'
              :'Not a security, legal or executive matter — it goes to its own team.'}
              ${moved('escalate')?` Model first said ${L.escalate?'yes':'no'}.`:''}</div></div>
          <div class="f" data-x="route"><div class="how">How?</div><div class="k">Where it goes</div>
            <div class="v"><code class="qp">${esc(d.queue)}</code></div>
            <div class="s">${d.escalation_queue
              ? `and a copy to <code class="qp esc">${esc(d.escalation_queue)}</code> for a human`
              : 'no human copy needed'}</div></div>
        </div></div>
      <h2 class="ssec">2 &middot; The reasoning behind it</h2>
      <div class="sec"><h3>Why it read it that way, overall</h3><div class="prose">${esc(x.rationale)}</div></div>
      <div class="sec"><h3>The safety net</h3>${guardIntro}<h4 class="subh">What it did to this ticket</h4>${guard}</div>
      <h2 class="ssec">3 &middot; Would it say the same thing again?</h2>
      <div class="sec"><h3>Repeatability</h3>
        <p class="prose" style="margin:0 0 11px">A model is sampled, not looked up, so the honest way to
        answer this is to run it rather than assert it. This reads <b>the same ticket twice more</b>, right
        now, and compares every field.
        <br><br>
        What has to match is what changes where the ticket goes — category, urgency, the escalation flag
        and the queue. Confidence and wording are expected to move a little, and are shown moving rather
        than scored as failures.</p>
        <div class="rc" id="rc"></div>
        <button class="tool" id="recheck">Read it again, twice</button>
        <p class="foot" id="rcfoot">Not done on every ticket by default: it would triple the bill on every
        intake for a number that does not change the routing. Consistency is a property you measure on a
        sample, not a tax you pay on every request. Offline, the same check runs across the whole gold set
        in <code>scripts/repeatability.py</code>.</p>
      </div>
      ${d.error?`<div class="sec"><h3>The model call failed, so keyword rules handled it</h3>
        <div class="note"><code>${esc(d.error)}</code></div></div>`:''}
      <div class="meta">
        <span>read by ${esc(d.model||'keyword rules')}</span>
        <span>took ${esc(took(d.latency_ms))}</span>
        <span>${esc(ago(d.created_at))}</span>
        ${d.usage&&d.usage.input_tokens?`<span>${d.usage.input_tokens} in / ${d.usage.output_tokens} out tokens</span>`:''}
        ${d.usage&&d.usage.cache_read_input_tokens?`<span>${d.usage.cache_read_input_tokens} cached \u00b7 1/10th price</span>`:''}
        ${costOf(d)!=null?`<span class="cost" title="Priced from the measured tokens in app/pricing.py">cost ${cents(costOf(d))}</span>`:''}
      </div>
      <details><summary>Full audit record</summary>${auditTable(d)}
        <details style="margin-top:10px"><summary>Raw JSON</summary><pre>${esc(JSON.stringify(d,null,2))}</pre></details>
      </details>
    </div>`;
  // Clicking a box opens a second-level pop-out for that one field, closable on its own.
  const TITLES={who:'Who sent it',what:'What kind of request',urgency:'How urgent it is',
                human:'Escalate beyond the owning team?',route:'Where it goes'};
  window.openField=(key)=>{
    $('#modal2').innerHTML=`<div class="m2head"><span class="t">${esc(TITLES[key]||key)}</span>
        <button class="x" id="m2x" aria-label="Close">&times;</button></div>
      <div class="m2body">${explainer(key,d)}</div>`;
    $('#scrim2').classList.add('on');
    $('#m2x').onclick=closeField;
    const u=new URL(location); u.searchParams.set('x',key); history.replaceState(null,'',u);
  };
  document.querySelectorAll('.f[data-x]').forEach(f=>f.onclick=()=>openField(f.dataset.x));

  // Read the same ticket again, live. The endpoint persists nothing and routes nothing — a
  // recheck is a consistency probe, not a decision, so it never lands in a queue.
  $('#recheck').onclick=async()=>{
    const btn=$('#recheck'), box=$('#rc');
    btn.disabled=true; btn.textContent='Reading\u2026';
    box.innerHTML=`<div class="note calm">Two fresh reads of the same text, in parallel. Takes about as
      long as one ticket did.</div>`;
    try{
      const r=await api(`/tickets/${d.id}/recheck?runs=2`,{method:'POST'});
      const cols=['As decided','Read again','And again'].slice(0,r.runs+1);
      const row=f=>`<tr class="${f.decisive?'':'soft'}">
        <td class="fname">${esc(f.label)}</td>
        ${f.values.map(v=>`<td>${esc(v)}</td>`).join('')}
        <td class="mk ${f.agree?'same':'diff'}">${f.agree?'\u2713 same':'moved'}</td></tr>`;
      const decisive=r.fields.filter(f=>f.decisive), soft=r.fields.filter(f=>!f.decisive);
      box.innerHTML=`
        <div class="verdict ok"><b>${r.stable
          ? 'Same decision all three times.'
          : 'The decision moved between reads.'}</b>
          ${r.stable
            ? `Every field that decides where this ticket goes came back identical. What moved was the
               confidence and the wording — shown below, because hiding it would be the dishonest
               version of this answer.`
            : `A field that changes routing did not reproduce. That is the number worth knowing, and it
               is why this check exists.`}</div>
        <table><thead><tr><th></th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead>
          <tbody>${decisive.map(row).join('')}
            <tr><td colspan="${r.runs+3}" style="padding-top:14px;border:0">
              <span class="subh">Allowed to move — not part of the routing decision</span></td></tr>
            ${soft.map(row).join('')}</tbody></table>
        <p class="foot">Read by ${esc(r.models.join(', '))} · ${r.latency_ms.map(m=>(m/1000).toFixed(1)+'s').join(' · ')}.
          Nothing here was saved or routed.</p>`;
      btn.textContent='Read it again, twice';
    }catch(e){
      box.innerHTML=`<div class="note changed"><b>The re-read failed.</b> <code>${esc(String(e.message||e))}</code></div>`;
      btn.textContent='Try again';
    }
    btn.disabled=false;
  };
  const wantX=new URL(location).searchParams.get('x');
  if(wantX&&TITLES[wantX]) openField(wantX);

  $('#mx').onclick=closeModal;
  $('#mprev').onclick=()=>i>0&&openModal(v[i-1].id);
  $('#mnext').onclick=()=>i<v.length-1&&openModal(v[i+1].id);
  $('#modal').scrollTop=0; $('#scrim').scrollTop=0;
}
function closeField(){
  $('#scrim2').classList.remove('on');
  const u=new URL(location); u.searchParams.delete('x'); history.replaceState(null,'',u);
}
function closeModal(){
  closeField();
  openId=null; $('#scrim').classList.remove('on'); document.body.style.overflow='';
  const u=new URL(location); u.searchParams.delete('t'); history.replaceState(null,'',u);
}
$('#scrim').onclick=e=>{if(e.target===$('#scrim')) closeModal()};
$('#scrim2').onclick=e=>{if(e.target===$('#scrim2')) closeField()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#scrim2').classList.contains('on')) return closeField();
  if(e.key==='Escape'&&openId) return closeModal();
  if(!openId||$('#scrim2').classList.contains('on')) return;
  if(['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName)) return;
  const v=visible(), i=v.findIndex(r=>r.id===openId);
  if((e.key==='ArrowRight'||e.key==='j')&&i<v.length-1){e.preventDefault();openModal(v[i+1].id)}
  if((e.key==='ArrowLeft'||e.key==='k')&&i>0){e.preventDefault();openModal(v[i-1].id)}
});

/* ── actions ───────────────────────────────────────────────────────────── */
async function reload(){rows=await api('/tickets?limit=300'); renderList();}
async function run(fn){busy(true);try{await fn()}catch(e){stopClock();status(e.message,{err:true,hold:9000})}finally{busy(false)}}

// Replay: no model call, so there is nothing to wait for and nothing to go wrong on stage.
async function loadRecorded(name,label){
  await run(async()=>{
    const before=(await api('/queues')).total;
    const r=await api('/tickets/load-recorded?fixture='+name,{method:'POST'});
    await reload();
    const added=(await api('/queues')).total-before;
    status(added
      ? `Loaded ${r.count} ${label} from a recorded run — no model calls.`
      : `Those ${r.count} were already loaded.`, {hold:5000});
  });
}

async function loadFixture(name,label){
  await run(async()=>{
    const before=(await api('/queues')).total;
    status(`Reading ${label}… a few seconds per ticket`,{spin:true});
    let done=false;
    const poll=setInterval(async()=>{if(done)return;
      try{const n=(await api('/queues')).total-before;
        if(n>0) status(`Read ${n} of ${label}…`,{spin:true});
        await reload()}catch{}},1500);
    let r; try{r=await api('/tickets/load-samples?fixture='+name,{method:'POST'})}
    finally{done=true;clearInterval(poll)}
    const added=(await api('/queues')).total-before;
    await reload();
    const failed=r.decisions.filter(d=>d.error).length;
    if(failed) status(`${failed} of ${r.count} fell back to keyword rules — open one to see the error.`,{err:true,hold:9000});
    else if(added===0) status(`Those ${r.count} tickets were already read — showing them. Press Clear all to run them again.`,{hold:8000});
    else status(`Read ${added} ticket${added===1?'':'s'}.`,{hold:4000});
  });
}
let tick=null;
function startClock(label){
  const t0=Date.now();
  const paint=()=>status(`${label} · ${((Date.now()-t0)/1000).toFixed(1)}s`,{spin:true});
  paint(); clearInterval(tick); tick=setInterval(paint,100);
}
function stopClock(){clearInterval(tick); tick=null;}

$('#submit').onclick=()=>run(async()=>{
  const t=$('#text').value.trim(); if(!t) return;
  const h=await api('/health').catch(()=>({}));
  startClock(h.model&&h.last_model_call!=='failing'?`Reading it with ${h.model}`:'Reading it');
  const d=await api('/tickets',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({text:t,source:'ui'})});
  $('#text').value=''; $('#text').style.height='';
  escOnly=false; sortBy='newest'; pick=null;
  stopClock();
  await reload(); await openModal(d.id);
  if(d.error) status('The model call failed — keyword rules handled it.',{err:true,hold:7000}); else status('');
});
$('#samples').onclick=()=>loadFixture('samples','10 samples');
$('#demo').onclick=()=>loadFixture('demo','32 demo tickets');
$('#rec-samples').onclick=()=>loadRecorded('samples','Climb samples');
$('#rec-demo').onclick=()=>loadRecorded('demo','demo tickets');
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const fd=new FormData();fd.append('file',f);
  run(async()=>{status(`Reading ${f.name}…`,{spin:true});
    const r=await api('/tickets/upload',{method:'POST',body:fd});
    await reload();status(`Read ${r.count} tickets from ${f.name}.`,{hold:4000})})
  .finally(()=>{e.target.value=''})};
$('#clear').onclick=()=>{if(!confirm('Delete every decision from the audit log?'))return;
  run(async()=>{await api('/tickets',{method:'DELETE'});closeModal();await reload();
    status('Cleared.',{hold:2500})})};
$('#menubtn').onclick=e=>{e.stopPropagation();closeMenu();$('#menupop').classList.toggle('on')};
$('#showbtn').onclick=e=>{e.stopPropagation();closeMenu();$('#showpop').classList.toggle('on')};
document.addEventListener('click',()=>closeMenu());
document.querySelectorAll('#menupop button').forEach(b=>b.addEventListener('click',closeMenu));
$('#v-list').onclick=()=>{setView('list');renderList()};
$('#v-queue').onclick=()=>{setView('queue');renderList()};

const ta=$('#text');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,150)+'px'});
ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')$('#submit').click()});

// The badge showed the last known state and only refreshed on reload, so a model that had come
// back still read "unreachable" until someone pressed F5 — during a demo that is indistinguishable
// from broken. Poll instead, and say so when it recovers.
let lastHealth = null;
async function refreshHealth(){
  let h; try { h = await api('/health'); } catch { return null; }
  const m = $('#mode'), live = h.mode === 'llm', failing = h.last_model_call === 'failing';
  m.className = 'mode' + (live && !failing ? '' : ' off');
  m.textContent = !live ? 'no API key — keyword rules only'
    : failing ? `${h.model} unreachable — keyword rules only`
    : `reading with ${h.model}`;
  const was = lastHealth && lastHealth.last_model_call;
  if (failing && h.last_model_error && was !== 'failing')
    status(`Model calls are failing, so tickets are being read by keyword rules. ${h.last_model_error.slice(0,140)}`, {err:true});
  if (!failing && was === 'failing')
    status(`Model is reachable again — ${h.model}.`, {hold:5000});
  lastHealth = h;
  return h;
}
setInterval(refreshHealth, 15000);

(async()=>{
  const h = await refreshHealth() || {};
  const live = h.mode === 'llm';
  await reload();
  const want=new URL(location).searchParams.get('t');
  if(want && rows.some(r=>r.id===want)) openModal(want);
})();
</script>
