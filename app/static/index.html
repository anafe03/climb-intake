<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climb Intake</title>
<style>
:root{
  /* Climb brand tokens, lifted verbatim from climb.ai's stylesheet */
  --climb-teal:#03323a; --climb-teal-mid:#006172; --climb-teal-soft:#8dbfc9;
  --climb-coral:#f27557; --climb-coral-mid:#b75238; --climb-coral-deep:#92351e; --climb-coral-darkest:#531405;
  --climb-cyan:#a2f1f8; --climb-mint:#c6f0cd; --climb-sage:#87a48c;
  --climb-paper:#f9f9f5; --climb-paper-line:#d3d3ca; --climb-ink:#121d1f;

  --teal:var(--climb-teal); --teal-dark:var(--climb-teal); --cyan:var(--climb-cyan);
  --bg:var(--climb-paper); --card:#fff; --sunken:#f2f2ea;
  --line:#e4e4d8; --line-2:var(--climb-paper-line);
  --text:var(--climb-ink); --dim:#5d6a6b; --faint:#949c9c;
  --primary:var(--climb-coral); --on-primary:#3a1004;
  --danger:var(--climb-coral-deep); --danger-wash:#fdeee9;
  --warn:var(--climb-coral-mid); --ok:#38714a;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08191c; --card:#0d2328; --sunken:#0a1d21;
  --line:#16343a; --line-2:#255059;
  --text:#e8f1f1; --dim:#9db3b5; --faint:#6f8a8d;
  --primary:var(--climb-coral); --on-primary:#3a1004;
  --danger:#f78e73; --danger-wash:#2c1712;
  --warn:#d98a6c; --ok:var(--climb-mint);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;border-radius:7px}
button:disabled{opacity:.4;cursor:default}

header{flex:none;background:var(--climb-teal);color:#fff;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:11px}
.brand b{font-size:15px;font-weight:650;display:block}
.brand small{font-size:12px;color:var(--cyan);opacity:.9;display:block;margin-top:1px}
.mode{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;background:var(--climb-coral);color:#3a1004;white-space:nowrap}
.mode.off{background:var(--climb-cyan);color:var(--climb-teal)}

.composer{flex:none;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;gap:10px}
.composer textarea{flex:1;min-height:42px;max-height:140px;padding:10px 13px;resize:none;
  border:1px solid var(--line-2);border-radius:8px;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
.composer textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
.composer textarea::placeholder{color:var(--faint)}
.go{background:var(--primary);color:var(--on-primary);padding:11px 20px;white-space:nowrap}
.go:hover:not(:disabled){filter:brightness(1.1)}

.status{flex:none;height:0;overflow:hidden;transition:height .15s;background:var(--sunken)}
.status.on{height:33px;border-bottom:1px solid var(--line)}
.status div{padding:7px 20px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:9px}
.status.err{background:var(--danger-wash);color:var(--climb-coral-darkest)}
.spin{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--primary);
  border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.split{flex:1;display:grid;grid-template-columns:330px 1fr;overflow:hidden}
.pane{overflow-y:auto;min-width:0}
.left{background:var(--sunken);border-right:1px solid var(--line)}

.bar{position:sticky;top:0;z-index:4;background:var(--sunken);border-bottom:1px solid var(--line);padding:11px 13px}
.bar h2{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.seg{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;margin-bottom:8px}
.sortseg button{font-size:11.5px;padding:5px 4px}
.seg button{flex:1;border:0;border-radius:0;background:transparent;color:var(--dim);padding:6px 4px;font-size:12px}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.seg button+button{border-left:1px solid var(--line-2)}
.tools{display:flex;gap:5px;flex-wrap:wrap}
.tool{background:transparent;border-color:var(--line-2);color:var(--dim);padding:5px 9px;font-size:11.5px}
.tool:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.tool.warn:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
input[type=file]{display:none}

.rows{padding:7px}
.row{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line-2);
  border-radius:7px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
.row:hover{border-color:var(--line-2)}
.row.sel{border-color:var(--primary);border-left-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.row.high{border-left-color:var(--warn)} .row.critical{border-left-color:var(--danger)}
.row.esc{background:var(--danger-wash);border-color:#f0d3c8}
.row .m{display:flex;gap:6px;align-items:center;font-size:10.5px;margin-bottom:4px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.row .m .c{color:var(--dim)}
.row .m .h{color:var(--warn)} .row .m .cr{color:var(--danger)}
.row .m .f{margin-left:auto;color:var(--danger)}
.row .t{font-size:12.5px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── detail: the transformation, told plainly ─────────────────────────── */
.detail{padding:26px 30px 70px;max-width:840px}
.dhead{font:11px var(--mono);color:var(--faint);margin:0 0 18px}
.flow{display:grid;grid-template-columns:1fr 34px 1fr;align-items:start;gap:0;margin-bottom:8px}
@media (max-width:760px){.flow{grid-template-columns:1fr;gap:10px}.arrow{transform:rotate(90deg);margin:0 auto}}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.box h3{margin:0 0 10px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);font-weight:700}
.box .raw{font-size:14px;line-height:1.6;color:var(--text)}
.arrow{text-align:center;color:var(--faint);font-size:20px;padding-top:44px}
.facts{display:flex;flex-direction:column;gap:11px}
.fact{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.fact .k{font-size:11px;color:var(--faint);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.fact .v{font-size:14.5px;font-weight:650;line-height:1.3}
.fact .v small{display:block;font-size:11.5px;font-weight:400;color:var(--dim);margin-top:3px;line-height:1.45}
.sig{display:inline-block;font:10.5px/1.5 var(--mono);background:var(--sunken);border:1px solid var(--line);
  border-radius:4px;padding:2px 7px;margin:3px 4px 0 0;color:var(--dim);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.v.critical{color:var(--danger)} .v.high{color:var(--warn)}
.v.yes{color:var(--danger)} .v.none{color:var(--faint);font-weight:500}

.dest{margin:14px 0 26px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:15px 18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.dest .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:700;width:100%}
.qpill{font:12.5px var(--mono);font-weight:600;background:var(--sunken);border:1px solid var(--line-2);
  padding:5px 11px;border-radius:6px}
.qpill.esc{background:var(--danger);border-color:var(--danger);color:#fff}

.sec{margin-bottom:24px}
.sec h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  font-weight:700;margin:0 0 9px}
.prose{font-size:14px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px 16px;
  font-size:13px;line-height:1.6}
.card.changed{border-left:3px solid var(--warn);border-radius:0 9px 9px 0}
.card.calm{color:var(--dim)}
.card code{font:11.5px var(--mono);background:var(--sunken);padding:1px 5px;border-radius:4px;color:var(--text)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--dim);font-size:12px;font-weight:650}
summary:hover{color:var(--primary)}
pre{background:var(--climb-teal);color:#d6ecef;border-radius:8px;padding:12px;overflow:auto;
  font:11px/1.5 var(--mono);max-height:320px;margin:8px 0 0}
.empty{padding:56px 30px;max-width:460px;color:var(--dim)}
.empty h3{margin:0 0 12px;font-size:17px;color:var(--text);font-weight:650}
.empty p{font-size:14px;line-height:1.65;margin:0 0 12px}
.empty ol{font-size:14px;line-height:1.9;padding-left:22px;margin:0}
.kbd{font:11px var(--mono);background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
@media (max-width:880px){
  body{overflow:auto}
  .split{grid-template-columns:1fr;overflow:visible}
  .pane{overflow:visible}
  /* Keep the list short so the explanation is reachable without scrolling past every ticket. */
  .left{border-right:0;border-bottom:1px solid var(--line);max-height:46vh;overflow-y:auto}
  .detail{padding:20px 18px 50px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M2 21.5 L10 6.5 L14.6 15 L17.2 10.5 L24 21.5 Z" fill="#a2f1f8"/>
      <path d="M10 6.5 L6.1 13.8 L8.4 12.6 L10.4 14.1 L12.3 12.2 L10 6.5 Z" fill="#fff"/>
    </svg>
    <div><b>Climb Intake</b><small>Reads a messy customer request and decides which team gets it</small></div>
  </div>
  <span class="mode" id="mode">…</span>
</header>

<div class="composer">
  <textarea id="text" rows="1" placeholder="Paste any customer message here — don't label it. Press ⌘↵"></textarea>
  <button class="go" id="submit">Read it</button>
</div>

<div class="status" id="status"><div id="statustext"></div></div>

<div class="split">
  <div class="pane left">
    <div class="bar">
      <h2 id="barcount">Tickets</h2>
      <p style="margin:-4px 0 9px;font-size:11px;color:var(--faint);line-height:1.4" id="sorthint">Newest run at the top</p>
      <div class="seg">
        <button id="f-all" class="on">All</button>
        <button id="f-esc">Needs a human</button>
      </div>
      <div class="seg sortseg">
        <button id="s-new" class="on">Most recent</button>
        <button id="s-pri">Most urgent</button>
      </div>
      <div class="tools">
        <button class="tool" id="samples">10 samples</button>
        <button class="tool" id="demo">32 demo</button>
        <button class="tool" id="up">Upload</button>
        <button class="tool warn" id="clear">Clear</button>
        <input type="file" id="file" accept=".json,.jsonl,.csv,.txt">
      </div>
    </div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="pane"><div class="detail" id="detail"></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>{s=String(s).replace(/_/g,' ');return s[0].toUpperCase()+s.slice(1)};
let rows=[], escOnly=false, selected=null, sortBy='newest';

/* plain-English vocabulary — the UI never shows raw enum names */
const CATEGORY={billing:'A billing question',bug:'Something is broken',security:'A security problem',
  legal_contract:'A contract or legal matter',onboarding:'An onboarding or delivery issue',
  feature_request:'A request for something new',spam:'Spam — not a real request',other:'A general question'};
const URGENCY={low:'Low — whenever',medium:'Medium — normal queue',
  high:'High — there is a deadline or real impact',critical:'Critical — money or many people affected right now'};
const REASON={security_incident:'a possible security incident',data_exposure:'data was exposed to the wrong people',
  legal_threat:'a legal or contract threat',compliance_request:'a regulatory demand with a deadline',
  executive_mention:'an executive is involved'};

async function api(p,o={}){const r=await fetch(p,o);
  if(!r.ok) throw new Error((await r.text()).slice(0,240));
  return r.headers.get('content-type')?.includes('json')?r.json():r.text();}

let st;
function status(msg,{spin=false,err=false,hold=0}={}){
  clearTimeout(st); const el=$('#status');
  if(!msg){el.classList.remove('on','err');return}
  $('#statustext').innerHTML=(spin?'<span class="spin"></span>':'')+esc(msg);
  el.classList.add('on'); el.classList.toggle('err',err);
  if(hold) st=setTimeout(()=>el.classList.remove('on','err'),hold);
}
function busy(on){document.querySelectorAll('.composer button,.bar button').forEach(b=>b.disabled=on)}
const RANK={critical:3,high:2,medium:1,low:0};
function triage(a,b){
  const x=a.extraction,y=b.extraction;
  if(x.escalate!==y.escalate) return x.escalate?-1:1;      // humans first
  if(RANK[y.urgency]!==RANK[x.urgency]) return RANK[y.urgency]-RANK[x.urgency];
  return (b.created_at||'').localeCompare(a.created_at||'');
}
const newest=(a,b)=>(b.created_at||'').localeCompare(a.created_at||'');
const filtered=()=>(escOnly?rows.filter(d=>d.extraction.escalate):rows)
  .slice().sort(sortBy==='newest'?newest:triage);

function renderRows(){
  const v=filtered(), n=rows.filter(d=>d.extraction.escalate).length;
  $('#barcount').textContent=rows.length?`${rows.length} tickets · ${n} need a human`:'Tickets';
  if(!v.length){
    $('#rows').innerHTML=`<div class="empty" style="padding:26px 12px"><p style="font-size:13px">${
      rows.length?'Nothing needs a human right now.':'Nothing loaded yet.'}</p></div>`;
    return;
  }
  $('#rows').innerHTML=v.map(d=>{const x=d.extraction;
    const uc=x.urgency==='critical'?'cr':x.urgency==='high'?'h':'';
    return `<div class="row ${x.urgency} ${x.escalate?'esc':''} ${selected===d.id?'sel':''}" data-id="${d.id}">
      <div class="m"><span class="c">${esc(cap(x.category))}</span>
        <span class="${uc}">${esc(x.urgency)}</span>
        ${x.escalate?'<span class="f">Needs a human</span>':''}</div>
      <div class="t">${esc(d.ticket.text)}</div></div>`}).join('');
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>select(r.dataset.id));
}
function emptyDetail(){
  $('#detail').innerHTML=`<div class="empty">
    <h3>What this does</h3>
    <p>Customer requests arrive as freeform text. Nobody labels them. This service reads each one and
       works out four things: <b>who sent it</b>, <b>what kind of request it is</b>, <b>how urgent it is</b>,
       and <b>whether a person needs to look at it</b>. Then it sends the ticket to the right team.</p>
    <p>To see it work:</p>
    <ol><li>Press <span class="kbd">10 samples</span> on the left, or</li>
        <li>paste any customer message up top and press <span class="kbd">Read it</span>.</li></ol>
    <p style="margin-top:14px">Then click any ticket to see what it decided and why.</p></div>`;
}

async function select(id,push=true){
  selected=id; renderRows();
  if(push){const u=new URL(location);u.searchParams.set('t',id);history.replaceState(null,'',u)}
  document.querySelector('.row.sel')?.scrollIntoView({block:'nearest'});
  const narrow=window.matchMedia('(max-width:880px)').matches;
  const d=await api('/tickets/'+id), x=d.extraction, L=d.llm_extraction;
  const moved=k=>L&&JSON.stringify(L[k])!==JSON.stringify(x[k]);

  const who=x.customer.name
    ? `${esc(x.customer.name)}${x.customer.contact_name?' <small>'+esc(x.customer.contact_name)+'</small>':''}`
    : `<span class="none">Not stated</span><small>The message never names a company, so we leave it blank rather than guess.${
        x.customer.identifiers.length?' We did pick up: '+esc(x.customer.identifiers.join(', ')):''}</small>`;
  const human=x.escalate
    ? `<span class="yes">Yes</span><small>Because ${x.escalation_reasons.map(r=>REASON[r]||cap(r)).join(', and ')}.</small>`
    : `<span class="none">No</span><small>Nothing here is a security, legal, or executive matter.</small>`;

  // Rules can fire and then cancel each other out. Compare the shipped answer to the model's
  // before claiming the safety net changed anything.
  const netChange = L && ['category','urgency','escalate'].some(k=>JSON.stringify(L[k])!==JSON.stringify(x[k]));
  const trail = d.overrides.map(o=>`<div style="margin-top:7px"><code>${esc(o)}</code></div>`).join('');
  let guard;
  if(d.overrides.length && (netChange || !L))
    guard=`<div class="card changed"><b>The safety net changed the answer.</b> A keyword rule spotted something the
      model missed, and rules may only make a ticket <i>more</i> urgent or escalated, never less.${trail}</div>`;
  else if(d.overrides.length)
    guard=`<div class="card calm"><b>Rules fired, then cancelled out — the reading is unchanged.</b>
      One rule matched and another undid it, so what ships is exactly what the model said. The full
      trail is kept for audit:${trail}</div>`;
  else if(d.rule_hits.length)
    guard=`<div class="card calm">A keyword rule matched this text and agreed with the reading. Nothing changed.
      <div style="margin-top:6px">${d.rule_hits.map(h=>`<code>${esc(h.rule)}</code> on “${esc(h.matched)}”`).join('<br>')}</div></div>`;
  else
    guard=`<div class="card calm">No escalation keyword matched, so the reading stands as-is.</div>`;

  $('#detail').innerHTML=`
    <p class="dhead">${esc(d.mode==='llm'?'read by '+(d.model||'model'):'read by keyword rules (no API key)')} · ${d.latency_ms} ms${d.ticket.external_id?' · '+esc(d.ticket.external_id):''}</p>
    <div class="flow">
      <div class="box"><h3>What came in</h3><div class="raw">${esc(d.ticket.text)}</div></div>
      <div class="arrow">→</div>
      <div class="box"><h3>What we worked out</h3><div class="facts">
        <div class="fact"><span class="k">Who</span><span class="v">${who}</span></div>
        <div class="fact"><span class="k">What</span><span class="v">${esc(CATEGORY[x.category]||cap(x.category))}
          ${moved('category')?`<small>The model first said “${esc(cap(L.category))}”.</small>`:''}</span></div>
        <div class="fact"><span class="k">Urgency</span><span class="v ${x.urgency}">${esc(URGENCY[x.urgency]||x.urgency)}
          ${x.urgency_signals.length?`<small>Picked up from the text:</small>${x.urgency_signals.slice(0,3).map(g=>{const t=g.length>46?g.slice(0,44).trim()+'…':g;return `<span class="sig" title="${esc(g)}">${esc(t)}</span>`}).join('')}`:''}
          ${moved('urgency')?`<small>The model first said “${esc(L.urgency)}”.</small>`:''}</span></div>
        <div class="fact"><span class="k">Human?</span><span class="v">${human}</span></div>
      </div></div>
    </div>
    <div class="dest"><span class="k">So it goes to</span>
      <span class="qpill">${esc(d.queue)}</span>
      ${d.escalation_queue?`<span style="color:var(--faint)">and a copy to</span><span class="qpill esc">${esc(d.escalation_queue)}</span>`:''}</div>
    <div class="sec"><h3>Why it read it that way</h3><div class="prose">${esc(x.rationale)}</div></div>
    <div class="sec"><h3>The safety net</h3>${guard}</div>
    ${d.error?`<div class="sec"><h3>The model call failed, so keyword rules handled it</h3>
       <div class="card"><code>${esc(d.error)}</code></div></div>`:''}
    <details><summary>Full audit record</summary><pre>${esc(JSON.stringify(d,null,2))}</pre></details>`;
  $('.pane:last-child').scrollTop=0;
  if(narrow) $('#detail').scrollIntoView({behavior:'smooth',block:'start'});
}

async function reload(reselect=false){
  rows=await api('/tickets?limit=300'); renderRows();
  if(!rows.length){selected=null;return emptyDetail()}
  if(reselect||!rows.some(r=>r.id===selected)){
    const v=filtered(); v.length?await select(v[0].id):emptyDetail();
  }
}
async function run(fn){busy(true);try{await fn()}catch(e){status(e.message,{err:true,hold:9000})}finally{busy(false)}}

async function loadFixture(name,label){
  await run(async()=>{
    const before=(await api('/queues')).total;
    status(`Reading ${label}… this takes a few seconds per ticket`,{spin:true});
    let done=false;
    const poll=setInterval(async()=>{if(done)return;
      try{const n=(await api('/queues')).total-before;
        if(n>0) status(`Read ${n} of ${label}…`,{spin:true});
        rows=await api('/tickets?limit=300'); renderRows();}catch{}},1500);
    let r; try{r=await api('/tickets/load-samples?fixture='+name,{method:'POST'})}
    finally{done=true;clearInterval(poll)}
    const added=(await api('/queues')).total-before;
    await reload(true);
    const failed=r.decisions.filter(d=>d.error).length;
    if(failed) status(`${failed} of ${r.count} fell back to keyword rules — open one to see the error.`,{err:true,hold:9000});
    else if(added===0) status(`Those ${r.count} tickets were already read — showing them. Press Clear to run them again.`,{hold:8000});
    else status(`Read ${added} ticket${added===1?'':'s'}.`,{hold:4000});
  });
}
$('#submit').onclick=()=>run(async()=>{
  const t=$('#text').value.trim(); if(!t) return;
  status('Reading it…',{spin:true});
  const d=await api('/tickets',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({text:t,source:'ui'})});
  $('#text').value=''; $('#text').style.height='';
  escOnly=false; $('#f-all').classList.add('on'); $('#f-esc').classList.remove('on');
  await reload(); await select(d.id);
  status(d.error?'The model call failed — keyword rules handled it instead.':'Done.',{err:!!d.error,hold:5000});
});
$('#samples').onclick=()=>loadFixture('samples','10 samples');
$('#demo').onclick=()=>loadFixture('demo','32 demo tickets');
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const fd=new FormData();fd.append('file',f);
  run(async()=>{status(`Reading ${f.name}…`,{spin:true});
    const r=await api('/tickets/upload',{method:'POST',body:fd});
    await reload(true);status(`Read ${r.count} tickets from ${f.name}.`,{hold:4000})})
  .finally(()=>{e.target.value=''})};
$('#clear').onclick=()=>{if(!confirm('Delete every decision?'))return;
  run(async()=>{await api('/tickets',{method:'DELETE'});selected=null;await reload(true);
    status('Cleared.',{hold:2500})})};
$('#s-new').onclick=()=>{sortBy='newest';$('#s-new').classList.add('on');$('#s-pri').classList.remove('on');
  $('#sorthint').textContent='Newest run at the top';renderRows()};
$('#s-pri').onclick=()=>{sortBy='priority';$('#s-pri').classList.add('on');$('#s-new').classList.remove('on');
  $('#sorthint').textContent='Escalations first, then by urgency';renderRows()};
$('#f-all').onclick=()=>{escOnly=false;$('#f-all').classList.add('on');$('#f-esc').classList.remove('on');reload(true)};
$('#f-esc').onclick=()=>{escOnly=true;$('#f-esc').classList.add('on');$('#f-all').classList.remove('on');reload(true)};

const ta=$('#text');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px'});
ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')$('#submit').click()});
document.addEventListener('keydown',e=>{
  if(['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName))return;
  const v=filtered();if(!v.length)return;
  const i=v.findIndex(r=>r.id===selected);
  if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();select(v[Math.min(i+1,v.length-1)].id)}
  if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();select(v[Math.max(i-1,0)].id)}});

(async()=>{
  const h=await api('/health'); const m=$('#mode'); const live=h.mode==='llm';
  m.className='mode'+(live?'':' off');
  m.textContent=live?`reading with ${h.model}`:'no API key — keyword rules only';
  const want=new URL(location).searchParams.get('t');
  rows=await api('/tickets?limit=300'); renderRows();
  if(want && rows.some(r=>r.id===want)) await select(want,false);
  else await reload(true);
})();
</script>
</body>
</html>
