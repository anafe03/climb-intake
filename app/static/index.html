<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climb Intake</title>
<style>
  :root{
    --bg:#0f1218;--panel:#161b24;--panel2:#1c2330;--line:#252d3b;--text:#e6e9ef;--muted:#8b95a7;
    --accent:#5b8def;--ok:#3ecf8e;--warn:#f5b642;--bad:#ff5c5c;--crit:#ff3b6b;--chip:#232b3a;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header h1 span{color:var(--muted);font-weight:400;margin-left:8px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;background:var(--chip);color:var(--muted)}
  .pill.llm{color:var(--ok);background:rgba(62,207,142,.12)}
  .pill.rules{color:var(--warn);background:rgba(245,182,66,.14)}
  main{display:grid;grid-template-columns:380px 1fr;gap:18px;padding:18px 22px;max-width:1500px;margin:0 auto}
  @media (max-width:980px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 12px;font-weight:600}
  textarea{width:100%;min-height:140px;resize:vertical;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--sans);font-size:14px}
  textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.danger{background:transparent;border:1px solid var(--line);color:var(--muted)}
  button:disabled{opacity:.5;cursor:default}
  input[type=file]{display:none}
  .queues{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .q{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
  .q:hover,.q.active{border-color:var(--accent)}
  .q b{display:block;font-size:20px;font-weight:600}
  .q small{color:var(--muted);font-family:var(--mono);font-size:11px}
  .q.esc b{color:var(--crit)}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr.t{cursor:pointer}
  tr.t:hover td{background:var(--panel2)}
  tr.t.sel td{background:rgba(91,141,239,.10)}
  .snip{max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--chip);color:var(--text);font-family:var(--mono)}
  .u-low{color:var(--muted)}.u-medium{color:var(--text)}.u-high{color:var(--warn)}.u-critical{color:var(--crit)}
  .esc-yes{color:var(--crit);font-weight:700}.esc-no{color:var(--muted)}
  .stack{display:flex;flex-direction:column;gap:18px}
  #detail .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:10px 0}
  #detail .kv div:nth-child(odd){color:var(--muted)}
  #detail p{margin:8px 0}
  .rat{background:var(--panel2);border-left:3px solid var(--accent);padding:10px 12px;border-radius:6px;white-space:pre-wrap}
  .rule{font-family:var(--mono);font-size:12px;background:var(--panel2);border-radius:6px;padding:8px 10px;margin:6px 0}
  .rule.fired{border-left:3px solid var(--warn)}
  .muted{color:var(--muted)}
  pre{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:420px}
  details summary{cursor:pointer;color:var(--muted);margin-top:12px}
  .empty{color:var(--muted);padding:26px;text-align:center}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-left:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .flag{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Climb Intake <span>ticket extraction &amp; routing</span></h1>
  <div><span id="mode" class="pill">…</span> <span id="model" class="flag"></span></div>
</header>
<main>
  <div class="stack">
    <section class="card">
      <h2>Submit a ticket</h2>
      <textarea id="text" placeholder="Paste a freeform customer request…"></textarea>
      <div class="row">
        <button id="submit">Classify &amp; route</button>
        <button class="ghost" id="samples">Load 10 Climb samples</button>
        <label><button class="ghost" onclick="document.getElementById('file').click()">Upload batch…</button></label>
        <input type="file" id="file" accept=".json,.jsonl,.txt">
        <span id="busy"></span>
      </div>
      <p class="flag" style="margin:10px 0 0">Batch upload accepts .json (array of strings or {"text":…}), .jsonl, or .txt with blank lines between tickets.</p>
    </section>
    <section class="card">
      <h2>Queues</h2>
      <div id="queues" class="queues"></div>
      <div class="row"><button class="danger" id="clearq">Clear filter</button><button class="danger" id="clearall">Clear audit log</button></div>
    </section>
  </div>
  <div class="stack">
    <section class="card">
      <h2>Decisions <span id="count" class="muted"></span></h2>
      <div id="list"></div>
    </section>
    <section class="card" id="detail"><h2>Why</h2><div class="empty">Select a ticket to see how it was classified and why.</div></section>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
let filter=null, selected=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path,opts={}){const r=await fetch(path,opts);if(!r.ok){throw new Error(await r.text())}return r.headers.get('content-type')?.includes('json')?r.json():r.text();}
function busy(on){$('#busy').innerHTML=on?'<span class="spin"></span>':'';document.querySelectorAll('button').forEach(b=>b.disabled=on);}

async function loadHealth(){const h=await api('/health');const m=$('#mode');m.textContent=h.mode==='llm'?'Claude + rules':'rules only';m.className='pill '+(h.mode==='llm'?'llm':'rules');$('#model').textContent=h.mode==='llm'?h.model:'no API key: degraded mode';}
async function loadQueues(){const q=await api('/queues');$('#queues').innerHTML=q.queues.map(x=>`<div class="q ${x.name.includes('escalation')?'esc':''} ${filter===x.name?'active':''}" data-q="${x.name}"><b>${x.count}</b><small>${x.name}</small></div>`).join('');document.querySelectorAll('.q').forEach(el=>el.onclick=()=>{filter=el.dataset.q;refresh();});}
async function loadList(){const rows=await api('/tickets?limit=200'+(filter?'&queue='+encodeURIComponent(filter):''));$('#count').textContent=rows.length?`(${rows.length}${filter?' in '+filter:''})`:'';
 if(!rows.length){$('#list').innerHTML='<div class="empty">No tickets yet. Submit one or load the samples.</div>';return;}
 $('#list').innerHTML=`<table><thead><tr><th>Ticket</th><th>Customer</th><th>Category</th><th>Urgency</th><th>Escalate</th><th>Queue</th></tr></thead><tbody>${rows.map(d=>{const x=d.extraction;return `<tr class="t ${selected===d.id?'sel':''}" data-id="${d.id}"><td><div class="snip" title="${esc(d.ticket.text)}">${d.ticket.external_id?`<span class="muted">#${esc(d.ticket.external_id)}</span> `:''}${esc(d.ticket.text)}</div></td><td>${esc(x.customer.name||'—')}</td><td><span class="tag">${x.category}</span></td><td class="u-${x.urgency}">${x.urgency}</td><td class="${x.escalate?'esc-yes':'esc-no'}">${x.escalate?'YES':'no'}</td><td class="muted" style="font-family:var(--mono);font-size:12px">${d.queue}${d.escalation_queue?'<br>+ '+d.escalation_queue:''}</td></tr>`}).join('')}</tbody></table>`;
 document.querySelectorAll('tr.t').forEach(tr=>tr.onclick=()=>{selected=tr.dataset.id;showDetail(selected);loadList();});}
async function showDetail(id){const d=await api('/tickets/'+id);const x=d.extraction;const L=d.llm_extraction;
 const diff=(k,fmt=v=>v)=>L&&JSON.stringify(L[k])!==JSON.stringify(x[k])?` <span class="muted">(model said ${esc(fmt(L[k]))})</span>`:'';
 $('#detail').innerHTML=`<h2>Why <span class="muted">· ${d.id} · ${d.mode}${d.model?' · '+d.model:''} · ${d.latency_ms} ms</span></h2>
 <div class="rat">${esc(d.ticket.text)}</div>
 <div class="kv">
  <div>Customer</div><div>${esc(x.customer.name||'unknown')}${x.customer.contact_name?' · '+esc(x.customer.contact_name):''}${x.customer.identifiers.length?' · <span class="muted">'+x.customer.identifiers.map(esc).join(', ')+'</span>':''}</div>
  <div>Category</div><div><span class="tag">${x.category}</span> <span class="muted">confidence ${x.category_confidence.toFixed(2)}</span></div>
  <div>Urgency</div><div class="u-${x.urgency}"><b>${x.urgency}</b>${diff('urgency')}${x.urgency_signals.length?' <span class="muted">← '+x.urgency_signals.map(esc).join(' · ')+'</span>':''}</div>
  <div>Escalate</div><div class="${x.escalate?'esc-yes':'esc-no'}">${x.escalate?'YES':'no'}${diff('escalate')} <span class="muted">${x.escalation_reasons.join(', ')}</span></div>
  <div>Routed to</div><div style="font-family:var(--mono)">${d.queue}${d.escalation_queue?' <span class="esc-yes">+ '+d.escalation_queue+'</span>':''}</div>
 </div>
 <p class="muted">Summary</p><p>${esc(x.summary)}</p>
 <p class="muted">${d.mode==='llm'?'Model rationale':'Rationale'}</p><div class="rat">${esc(x.rationale)}</div>
 <p class="muted">Guardrail rules</p>${d.rule_hits.length?d.rule_hits.map(h=>`<div class="rule fired"><b>${h.rule}</b> matched “${esc(h.matched)}” → ${esc(h.effect)}</div>`).join(''):'<div class="rule">none fired</div>'}
 ${d.overrides.length?`<p class="muted">Overrides applied to the model's answer</p>${d.overrides.map(o=>`<div class="rule fired">${esc(o)}</div>`).join('')}`:''}
 ${d.error?`<p class="muted">Error</p><div class="rule">${esc(d.error)}</div>`:''}
 <details><summary>Raw decision JSON (audit record)</summary><pre>${esc(JSON.stringify(d,null,2))}</pre></details>
 <details><summary>Plain-text explain endpoint</summary><pre id="explain">loading…</pre></details>`;
 $('#detail details:last-child').addEventListener('toggle',async e=>{if(e.target.open){$('#explain').textContent=await api('/tickets/'+id+'/explain');}},{once:true});}
async function refresh(){await Promise.all([loadQueues(),loadList()]);}

$('#submit').onclick=async()=>{const t=$('#text').value.trim();if(!t)return;busy(true);try{const d=await api('/tickets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:t,source:'ui'})});selected=d.id;$('#text').value='';await refresh();showDetail(d.id);}catch(e){alert(e.message)}finally{busy(false)}};
$('#samples').onclick=async()=>{busy(true);try{await api('/tickets/load-samples',{method:'POST'});await refresh();}catch(e){alert(e.message)}finally{busy(false)}};
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);busy(true);try{await api('/tickets/upload',{method:'POST',body:fd});await refresh();}catch(err){alert(err.message)}finally{busy(false);e.target.value='';}};
$('#clearq').onclick=()=>{filter=null;refresh();};
$('#clearall').onclick=async()=>{if(!confirm('Delete all audit records?'))return;await api('/tickets',{method:'DELETE'});selected=null;$('#detail').innerHTML='<h2>Why</h2><div class="empty">Select a ticket to see how it was classified and why.</div>';refresh();};
$('#text').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')$('#submit').click();});
loadHealth();refresh();
</script>
</body>
</html>
